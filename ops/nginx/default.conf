# Serve the browser app and proxy Mendel and Wiener under the same origin.
# This configuration is copied into the browser image by frontend/Dockerfile.

# Forward an upgrade connection only for clients requesting one, including run WebSockets.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

server {
  listen 80;

  # Resolve variable upstreams through Docker DNS so API container replacements can acquire
  # new addresses without rebuilding the proxy. Cache DNS answers for 10 seconds.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Wiener owns run, artifact and execution-settings routes. Mendel owns the remaining API.
  # Keep this split aligned with the development proxy in frontend/vite.config.ts.
  # Run streams require HTTP/1.1 and explicit WebSocket upgrade headers.
  location /api/runs {
    set $wiener http://wiener-api:8001;
    proxy_pass $wiener$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Allow a day between upstream reads on a long-lived run stream.
    proxy_read_timeout 1d;
  }

  location /api/artifacts {
    set $wiener http://wiener-api:8001;
    proxy_pass $wiener$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Artifact uploads carry a complete pipeline bundle.
    client_max_body_size 512m;
  }

  # Execution settings and status are served by Wiener.
  location /api/wiener {
    set $wiener http://wiener-api:8001;
    proxy_pass $wiener$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /api/ {
    set $upstream http://api:8000;
    proxy_pass $upstream$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Fall back to index.html for browser routes so deep links survive a page refresh.
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}
