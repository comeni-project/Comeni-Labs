# `Connection: upgrade` only when the client asked for it; `close` otherwise. A bare
# `proxy_set_header Connection "upgrade"` breaks every ordinary request through this server.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

server {
  listen 80;

  # **Docker's embedded DNS, and an upstream in a variable.** nginx resolves a literal upstream
  # ONCE at startup and caches the address forever — so rebuilding `api` gives it a new
  # container IP and every request 502s until nginx is restarted. Measured: `api direct 200`,
  # `via nginx 502`, `nginx after a restart 200`. A variable forces resolution per request,
  # which is what makes `make dev` survive rebuilding the API underneath it.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # **Two APIs on one origin, split by path, most specific first.** `vite.config.ts` makes
  # exactly this split in development and prod did not, which is the kind of difference that
  # only shows up in production. nginx picks the longest matching prefix regardless of order,
  # so these are correct wherever they sit — the order is for whoever reads the file.
  #
  # The WebSocket needs `Upgrade` forwarded explicitly, or the console silently falls back to
  # never connecting: the tail simply never arrives and nothing on screen says why.
  location /api/runs {
    set $wiener http://wiener-api:8001;
    proxy_pass $wiener$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # A run's socket is open for as long as the run, and a three-day run is the point.
    proxy_read_timeout 1d;
  }

  location /api/artifacts {
    set $wiener http://wiener-api:8001;
    proxy_pass $wiener$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # A gated pipeline directory, uploaded whole — §12's courier.
    client_max_body_size 512m;
  }

  location /api/ {
    set $upstream http://api:8000;
    proxy_pass $upstream$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # `try_files` falls back to index.html so a deep link survives a hard refresh — the SPA does
  # its own routing under `/forge/*` and nginx must not 404 a path only React knows about.
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}
