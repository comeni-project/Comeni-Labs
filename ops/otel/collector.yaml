# Receive OTLP traces and metrics, batch them, and store them in ClickHouse.
# The pipelines include no sampling processor. Retention is controlled by the exporter TTL;
# Wiener keeps application run records separately in PostgreSQL.
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }

processors:
  batch:
    timeout: 5s

exporters:
  clickhouse:
    endpoint: tcp://clickhouse:9000?dial_timeout=10s
    # Match the local ClickHouse account configured by the Compose telemetry profile.
    username: otel
    password: otel
    database: otel
    create_schema: true
    ttl: 720h
    # Retain telemetry for 30 days; application records have a separate lifetime.

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [clickhouse]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [clickhouse]
