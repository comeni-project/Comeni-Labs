# Provision the ClickHouse data source used by the committed Wiener dashboards.
# The account matches the local Compose telemetry profile and collector configuration.
apiVersion: 1
datasources:
  - name: ClickHouse
    uid: wiener-clickhouse
    type: grafana-clickhouse-datasource
    isDefault: true
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      username: otel
      defaultDatabase: otel
    secureJsonData:
      password: otel
