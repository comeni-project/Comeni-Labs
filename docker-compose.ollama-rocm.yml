# AMD GPU support for the local Ollama server. Start with `make ai-up OLLAMA_GPU=rocm`.
# Set OLLAMA_IMAGE=ollama/ollama:<version>-rocm in .env to use a matching runtime.
# This overlay adds host GPU devices and permissions; enable it on an AMD GPU host.

services:
  # Give the local model server access to the host AMD GPU.
  ollama:
    devices:
      - /dev/kfd
      - /dev/dri
    # Set the host GPU device-group IDs through RENDER_GID and VIDEO_GID.
    group_add:
      - "${RENDER_GID:-render}"
      - "${VIDEO_GID:-video}"
    # Allow GPU runtime system calls and use the host shared-memory namespace.
    security_opt:
      - seccomp:unconfined
    ipc: host
    environment:
      # Optional GPU architecture override; pass it through only when set on the host.
      - HSA_OVERRIDE_GFX_VERSION
