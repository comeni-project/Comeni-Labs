<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- The wordmark's pea, at tab size.

       The shape is the nav's own mark: a square with three corners rounded to 50% and one left
       square, turned -45deg, which reads as a seed. It is the product's name made literal —
       Mendel counted peas — and it is the only mark in the interface, so the tab and the header
       are the same object rather than two ideas about one product.

       Replaces a purple #863bff graphic from a scaffold that had nothing to do with this. -->
  <rect width="32" height="32" rx="7" fill="#F4F6F5"/>
  <g transform="rotate(-45 16 16)">
    <path d="M8 24 V16 a8 8 0 0 1 16 0 a8 8 0 0 1 -16 8 Z" fill="#2C6E49"/>
  </g>
</svg>
