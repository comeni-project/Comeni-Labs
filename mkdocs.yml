# Build and serve the Comeni Labs documentation with MkDocs Material.
# Use make wiki or make wiki-serve to generate the tool catalogue before building.
# Sections: site paths; page inclusion; appearance; Markdown and plugins; navigation.

site_name: Comeni Labs
site_description: One platform for planning, running and watching bioinformatics analyses.
docs_dir: docs
site_dir: site
use_directory_urls: true

# -----------------------------------------------------------------------------
# Page inclusion
# -----------------------------------------------------------------------------
# Keep internal notes and plans out of the published site.
# /README.md also excludes the retired top-level documentation entry point if it reappears.
exclude_docs: |
  notes/
  superpowers/
  assets/vendor/**/README.md
  /README.md

# Keep the homepage outside the four documentation paths.
# Generated tool pages remain accessible through Reference > Available tools and search.
# Include virtual legacy addresses here; their source folders no longer exist.
not_in_nav: |
  index.md
  reference/tools/**/*.md
  tools/**
  start/**
  handbook/**
  registry/**
  how-to/registry/review-proposals.md
  internals/**
  design/**
  status.md


# -----------------------------------------------------------------------------
# Appearance
# -----------------------------------------------------------------------------
theme:
  name: material
  custom_dir: tools/documentation_theme
  font: false          # Custom CSS loads the Geist fonts.
  palette:
    scheme: slate      # Match the app's dark appearance.
  features:
    - navigation.tabs      # Show the four documentation paths as tabs.
    - navigation.sections
    - navigation.indexes   # Use each section's index page as its landing page.
    - content.code.copy
    - toc.follow

extra_css:
  - assets/comeni.css

extra:
  # Authoritative label for the generated stage badge.
  stage: "Alpha · pre-MVP"
  polyfills:
    - assets/vendor/iframe-worker/shim.js

# -----------------------------------------------------------------------------
# Markdown and plugins
# -----------------------------------------------------------------------------
markdown_extensions:
  - admonition           # Format notices, including "Not built yet".
  - pymdownx.details     # Allow collapsible notices.
  # Render fenced Mermaid blocks as diagrams.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

hooks:
  - tools/documentation_locations.py
  - tools/documentation_theme.py

plugins:
  - search
  - offline               # Support local-file browsing and search; fonts/diagrams may need network access.

# -----------------------------------------------------------------------------
# Navigation
# -----------------------------------------------------------------------------
nav:
  - Tutorials:
      - tutorials/index.md
      - Your first pipeline: tutorials/first-pipeline.md
      - RNA-seq example: tutorials/rnaseq-example.md
  - How-to guides:
      - how-to/index.md
      - Use Comeni:
          - Install and open the app: how-to/install.md
          - Work with the builder: how-to/pipelines/build.md
          - Answer with a sample: how-to/pipelines/answer-with-sample.md
          - Review decisions: how-to/pipelines/review.md
          - Run a pipeline: how-to/pipelines/run.md
          - Watch a run: how-to/pipelines/watch.md
      - Maintain registry data:
          - Browse the module catalogue: how-to/registry/browse-catalogue.md
          - Forge a tool: how-to/registry/forge-a-tool.md
          - Write a contract: how-to/registry/add-tool.md
          - Write a data-dependent rule: how-to/registry/write-rule.md
          - Add a lab layer: how-to/registry/add-layer.md
      - Develop the platform:
          - Contribute a change: how-to/development/contribute.md
          - Run the development stack: how-to/development/local-stack.md
          - Configure a model: how-to/development/configure-model.md
          - Walk and investigate behavior: how-to/development/investigate.md
          - Walk the forge live: how-to/development/forge-live-walk.md
          - Release a package: how-to/development/release.md
          - Maintain documentation: how-to/development/documentation.md
  - Reference:
      - reference/index.md
      - Pipelines and commands:
          - Glossary: reference/pipelines/glossary.md
          - Builder interface: reference/pipelines/builder-interface.md
          - CLI: reference/pipelines/cli.md
          - Pipeline schema: reference/pipelines/pipeline-schema.md
          - Goal schema: reference/pipelines/goal-schema.md
          - Diagnostics: reference/pipelines/diagnostics.md
      - Registry declarations:
          - Contract schema: reference/registry/contract-schema.md
          - Rule schema: reference/registry/rule-schema.md
          - Vocabulary schema: reference/registry/vocabulary-schema.md
          - Measurement schema: reference/registry/measurement-schema.md
      - Available tools:
          - reference/tools.md
          - reference/tools/catalogue.md
      - Development services: reference/development-services.md
      - Documentation status: reference/status.md
  - Explanation:
      - explanation/index.md
      - Workflow and decisions:
          - The product loop: explanation/pipeline-lifecycle.md
          - Core concepts: explanation/pipeline-concepts.md
          - The four tiers: explanation/decision-tiers.md
          - How tools get chosen: explanation/tool-selection.md
          - Build inputs and run inputs: explanation/inputs-and-data.md
      - Registry design:
          - Registry knowledge: explanation/registry.md
          - Tool contracts: explanation/tool-contracts.md
          - Data-backed rules: explanation/data-backed-rules.md
          - Registry layers: explanation/registry-layers.md
      - Architecture: explanation/architecture.md
      - Package responsibilities: explanation/package-boundaries.md
      - Mendel AI ownership: explanation/mendel-ai-ownership.md
      - Design boundaries:
          - Invariants: explanation/invariants.md
          - Authoring protocol: explanation/authoring-protocol.md
          - Product voice: explanation/product-language.md
          - Visual identity: explanation/visual-identity.md
          - Protocol diagram: explanation/diagrams/authoring-protocol.md
          - Forging protocol diagram: explanation/diagrams/forging-protocol.md
