site_name: Comeni Labs
site_description: One platform for planning, running and watching bioinformatics analyses.
docs_dir: docs
site_dir: site
use_directory_urls: true

# Provenance and specs are read on GitHub, never in a sidebar. Spec §7.
#
# docs/README.md is the pre-wiki documentation front door — docs/index.md is its replacement
# and the two collide at the same site root (`index.html`), so the old one is excluded here
# rather than left to lose the collision silently. Anchored, like /build/ in .gitignore and
# for the same reason: an unanchored `README.md` would also swallow every book's own README
# (docs/guides/README.md and friends), which stay until Task 3 moves them. Whether Task 3
# deletes the root file outright or folds its content into a book is that task's call, not
# this one's; until it is decided the file is still readable on GitHub, same as notes/ and
# superpowers/ above.
#
# tutorial.md, concepts/, guides/ and reference/ have not moved into a book yet either, and
# excluding them (rather than merely keeping them out of nav) is what stops MkDocs building
# and link-checking them at all — they carry pre-existing broken links to pages that do not
# exist yet in this tree (e.g. docs/guides/README.md -> ../tutorial.md), and a page that is
# built but unlinked would let --strict silently swallow a *new* broken link anywhere in the
# five real books too. Task 3 moves this content into the books and DELETES these four lines.
exclude_docs: |
  notes/
  superpowers/
  /README.md
  tutorial.md
  concepts/
  guides/
  reference/

# index.md is the site homepage, served at `/` — it stays outside the nav by design, since
# the top level is exactly the five books (test_the_five_books_are_the_top_level_nav_in_order)
# and a sixth entry for it would break that. This entry is permanent, unlike exclude_docs'
# four lines above.
#
# tools/*/*.md is the tool catalogue `mendel docs` renders — one page per tool, nested under
# its registry org (tools/nf-core/fastqc.md). Core MkDocs `nav:` has no directory or glob
# form, so the pages generated here cannot be named in nav ahead of time (the set depends on
# --registry) and are excluded from the "orphan page" check instead. They stay reachable: a
# page missing from nav is still built and still in Material's search index, and tools/index.md
# points a reader there.
not_in_nav: |
  index.md
  tools/*/*.md

theme:
  name: material
  font: false          # Geist is loaded by docs/assets/comeni.css, Task 4
  features:
    - navigation.tabs      # the five books, across the top. This is why Material and not mdBook
    - navigation.sections
    - navigation.indexes   # a book's index.md is its tab's landing page
    - content.code.copy
    - toc.follow

extra_css:
  - assets/comeni.css

extra:
  # Spec §6.1 — stamp the stage rather than version the books. One string, one place.
  stage: "Alpha · pre-MVP"

markdown_extensions:
  - admonition           # the `Not built yet` marker
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - offline               # the built site works from file:// with search. Spec §6

nav:
  - Start here:
      - start/index.md
  - Handbook:
      - handbook/index.md
  - Tools:
      - tools/index.md
  - Registry:
      - registry/index.md
  - Internals:
      - internals/index.md
