# Build and serve the Comeni Labs documentation with MkDocs Material.
# Use make wiki or make wiki-serve to generate the tool catalogue before building.
# Sections: site paths; page inclusion; appearance; Markdown and plugins; navigation.

site_name: Comeni Labs
site_description: One platform for planning, running and watching bioinformatics analyses.
docs_dir: docs
site_dir: site
use_directory_urls: true

# -----------------------------------------------------------------------------
# Page inclusion
# -----------------------------------------------------------------------------
# Keep internal notes and plans out of the published site.
# /README.md also excludes the retired top-level documentation entry point if it reappears.
exclude_docs: |
  notes/
  superpowers/
  /README.md

# Keep the homepage outside the five navigation tabs.
# Generated tool pages remain accessible through Tools > catalogue and search.
# These patterns suppress warnings about pages missing from the navigation.
not_in_nav: |
  index.md
  tools/*/*.md

# -----------------------------------------------------------------------------
# Appearance
# -----------------------------------------------------------------------------
theme:
  name: material
  font: false          # Custom CSS loads the Geist fonts.
  palette:
    scheme: slate      # Match the app's dark appearance.
  features:
    - navigation.tabs      # Show the five documentation sections as tabs.
    - navigation.sections
    - navigation.indexes   # Use each section's index page as its landing page.
    - content.code.copy
    - toc.follow

extra_css:
  - assets/comeni.css

extra:
  # Product-stage metadata; the visible stage label currently lives in custom CSS.
  stage: "Alpha · pre-MVP"

# -----------------------------------------------------------------------------
# Markdown and plugins
# -----------------------------------------------------------------------------
markdown_extensions:
  - admonition           # Format notices, including "Not built yet".
  - pymdownx.details     # Allow collapsible notices.
  # Render fenced Mermaid blocks as diagrams.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - offline               # Support local-file browsing and search; fonts/diagrams may need network access.

# -----------------------------------------------------------------------------
# Navigation
# -----------------------------------------------------------------------------
nav:
  - Start here:
      - start/index.md
      - Install and open the app: start/install-and-open.md
      - Your first pipeline: handbook/your-first-pipeline.md
      - What is not built yet: status.md
  - Handbook:
      - handbook/index.md
      - The product loop: handbook/product-loop.md
      - Core words: handbook/core-words.md
      - RNA-seq example: handbook/rnaseq-example.md
      - The builder: handbook/builder.md
      - Reviewing decisions: handbook/reviewing-decisions.md
      - Inputs in the alpha: handbook/inputs-alpha.md
      - Running pipelines: handbook/running-pipelines.md
      - Watching runs: handbook/watching-runs.md
      - Understanding tool choice:
          - The four tiers: handbook/the-four-tiers.md
          - How tools get chosen: handbook/how-tools-get-chosen.md
      - Local development stack: handbook/the-stack.md
      - Reference:
          - handbook/reference/glossary.md
          - handbook/reference/diagnostics.md
          - handbook/reference/pipeline-schema.md
          - handbook/reference/goal-schema.md
          - Advanced CLI reference: handbook/reference/cli.md
  - Tools:
      - tools/index.md
      # Generate this page with make wiki-tools; the wiki targets do that for you.
      - tools/catalogue.md
  - Registry:
      - registry/index.md
      - Using the forge: registry/using-the-forge.md
      - Writing a contract: registry/writing-a-contract.md
      - Making a choice depend on your data: registry/making-a-choice-depend-on-your-data.md
      - Your lab's own layer: registry/your-labs-own-layer.md
      - Reference:
          - registry/reference/contract-schema.md
          - registry/reference/rule-schema.md
          - registry/reference/vocabulary-schema.md
          - registry/reference/measurement-schema.md
  - Internals:
      - internals/index.md
      - Documentation style: internals/documentation-style.md
      - Releasing: internals/releasing.md
