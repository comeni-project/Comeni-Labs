site_name: Comeni Labs
site_description: One platform for planning, running and watching bioinformatics analyses.
docs_dir: docs
site_dir: site
use_directory_urls: true

# Provenance and specs are read on GitHub, never in a sidebar. Spec §7.
#
# docs/README.md was the pre-wiki documentation front door; docs/index.md is its replacement.
# Task 3's move table has no destination for it — `git rm docs/README.md` — so `/README.md`
# here now excludes a path that does not exist. Left in rather than deleted: `notes/` and
# `superpowers/` are excluded the same way for the same reason (nothing under docs/ should be
# built or link-checked that is not one of the five books), and this line reads as one more
# instance of that rule rather than dead configuration.
exclude_docs: |
  notes/
  superpowers/
  /README.md

# index.md is the site homepage, served at `/` — it stays outside the nav by design, since
# the top level is exactly the five books (test_the_five_books_are_the_top_level_nav_in_order)
# and a sixth entry for it would break that.
#
# tools/*/*.md is the per-tool pages `mendel docs` renders — one per tool, nested under its
# registry org (tools/nf-core/fastqc.md). Core MkDocs `nav:` has no directory or glob form, so
# the individual pages cannot be named in nav ahead of time (the set depends on --registry) and
# are excluded from the "orphan page" check instead. tools/catalogue.md — generated by
# tools/generate_tools_catalogue.py, run by `make wiki-tools` right after `mendel docs` — IS
# named in nav above, grouping the individual pages by org, so a reader reaches them by
# clicking rather than only by search.
not_in_nav: |
  index.md
  tools/*/*.md

theme:
  name: material
  font: false          # Geist is loaded by docs/assets/comeni.css, Task 4
  palette:
    scheme: slate      # the Observatory is dark by default, like the product
  features:
    - navigation.tabs      # the five books, across the top. This is why Material and not mdBook
    - navigation.sections
    - navigation.indexes   # a book's index.md is its tab's landing page
    - content.code.copy
    - toc.follow

extra_css:
  - assets/comeni.css

extra:
  # Spec §6.1 — stamp the stage rather than version the books. One string, one place.
  stage: "Alpha · pre-MVP"

markdown_extensions:
  - admonition           # the `Not built yet` marker
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - offline               # the built site works from file:// with search. Spec §6

nav:
  - Start here:
      - start/index.md
      - Install and open the app: start/install-and-open.md
      - Your first pipeline: handbook/your-first-pipeline.md
      - What is not built yet: status.md
  - Handbook:
      - handbook/index.md
      - The product loop: handbook/product-loop.md
      - Core words: handbook/core-words.md
      - RNA-seq example: handbook/rnaseq-example.md
      - The builder: handbook/builder.md
      - Reviewing decisions: handbook/reviewing-decisions.md
      - Inputs in the alpha: handbook/inputs-alpha.md
      - Running pipelines: handbook/running-pipelines.md
      - Watching runs: handbook/watching-runs.md
      - Understanding tool choice:
          - The four tiers: handbook/the-four-tiers.md
          - How tools get chosen: handbook/how-tools-get-chosen.md
      - Local development stack: handbook/the-stack.md
      - Reference:
          - handbook/reference/glossary.md
          - handbook/reference/diagnostics.md
          - handbook/reference/pipeline-schema.md
          - handbook/reference/goal-schema.md
          - Advanced CLI reference: handbook/reference/cli.md
  - Tools:
      - tools/index.md
      # generated by `make wiki-tools`, not by mkdocs itself — a bare `mkdocs build` or
      # `mkdocs serve` aborts under --strict without it. Run `make wiki` / `make wiki-serve`.
      - tools/catalogue.md
  - Registry:
      - registry/index.md
      - Using the forge: registry/using-the-forge.md
      - Writing a contract: registry/writing-a-contract.md
      - Making a choice depend on your data: registry/making-a-choice-depend-on-your-data.md
      - Your lab's own layer: registry/your-labs-own-layer.md
      - Reference:
          - registry/reference/contract-schema.md
          - registry/reference/rule-schema.md
          - registry/reference/vocabulary-schema.md
          - registry/reference/measurement-schema.md
  - Internals:
      - internals/index.md
      - Documentation style: internals/documentation-style.md
      - Releasing: internals/releasing.md
