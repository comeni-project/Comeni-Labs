declares: contract
id: nf-core/star/genomegenerate@2.7.11b
roles: [index_building]
nf_process: STAR_GENOMEGENERATE
nf_include: modules/nf-core/star/genomegenerate/main
consumes:
  - {name: fasta, type_id: genome.fasta}
  - {name: gtf, type_id: annotation.gtf}
produces: [{name: index, type_id: genome.index.star}]
params:
  - name: genome_sa_index_nbases
    tier_hint: 3
    domain: {kind: integer, minimum: 1, maximum: 14}
    via: ext
    key: args
    template: "--genomeSAindexNbases {value}"
  # The shipped registry's own name for it (#461): its rule `star_index.yml` decides this one,
  # and a contract replacing the base must still declare what the base's rules decide.
  - name: sa_index_nbases
    tier_hint: 4
    domain: {kind: integer, minimum: 4, maximum: 14}
    via: ext
    key: args
    template: "--genomeSAindexNbases {value}"
priority: 0
provenance: {source: hand, drafted_by: hand, approved_by: corpus, approved_at: "2026-08-15"}
