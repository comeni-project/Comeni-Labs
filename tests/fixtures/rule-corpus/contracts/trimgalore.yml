declares: contract
id: nf-core/trimgalore@0.6.10
roles: [trimming]
nf_process: TRIMGALORE
nf_include: modules/nf-core/trimgalore/main
consumes: [{name: reads, type_id: fastq.reads, state_required: []}]
produces: [{name: reads, type_id: fastq.reads, state: [trimmed]}]
params:
  - name: trim_min_length
    tier_hint: 3
    domain: {kind: integer, minimum: 1, maximum: 200}
    via: ext
    key: args
    template: "--length {value}"
  - name: clip_r1
    tier_hint: 3
    domain: {kind: integer, minimum: 0, maximum: 20}
    via: ext
    key: args
    template: "--clip_R1 {value}"
priority: 0
provenance: {source: hand, drafted_by: hand, approved_by: corpus, approved_at: "2026-08-15"}
