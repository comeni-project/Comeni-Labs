      tier: 2
      source: resolver
      reason: 'Align *with* the annotation. The GTF is routed into this module, and ignoring it would
        discard the splice-junction information a spliced aligner exists to use. A laboratory aligning
        against a genome whose annotation it does not trust wants this true. Audit A91: it was a hardcoded
        `false` in the call, outside the tier ladder and answerable by nobody, because no route reached
        a bare `val`.'
