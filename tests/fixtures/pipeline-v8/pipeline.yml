- id: star_align
  module:
    contract_id: nf-core/star/align@2.7.11b
    digest: sha256:671970d4391500a79270d9e67493738e36b8b9ab52c2e422650fee427304ba11
    container: community.wave.seqera.io/library/htslib_samtools_star_gawk:ae438e9a604351a4
  process: STAR_ALIGN
  include: modules/nf-core/star/align/main
  why:
    tier: 3
    source: resolver
    reason: 'rule implementation:alignment where read_length is 150, asserted, not measured: STAR''s
      seed-and-extend search is built for long reads and is nf-core/rnaseq''s default aligner; the
      index cost it pays back over reads this length; Dobin et al. 2013, doi:10.1093/bioinformatics/bts635'
    premise:
    - id: read_length
      value: 150
      origin: asserted
    for_value: nf-core/star/align@2.7.11b
    axis_reason: read length determines which aligner is appropriate; Dobin et al. 2013, doi:10.1093/bioinformatics/bts635
    from_layer: comeni-registry-examples
    displaced_layer: null
    review_level: advisory
  presence:
    tier: 1
    source: resolver
    reason: nf-core/samtools/sort@1.24 requires 'alignment.bam' here
    premise: []
    for_value: null
    axis_reason: ''
    from_layer: null
    displaced_layer: null
    review_level: none
  ext_args:
    template: --readFilesCommand zcat
    why:
      tier: 1
      source: resolver
      reason: 'The reads reaching STAR in this registry are gzipped, and STAR reads plain text unless
        told otherwise. Stated as a premise about the *reads* rather than as a fact about TrimGalore,
        which is how it was written before: one goal edit — declaring the reads already trimmed —
        removes TrimGalore from the pipeline while this flag survives, and the old reason then named
        a module that was not there. Audit A82. **Where this is false it is actively wrong and nothing
        here will catch it**: a laboratory supplying uncompressed trimmed reads needs this removed.
        Expressing that as a condition is issue #39''s `when`-expressiveness problem, not this field''s.'
      premise: []
      for_value: --readFilesCommand zcat
      axis_reason: ''
      from_layer: null
      displaced_layer: null
      review_level: none
