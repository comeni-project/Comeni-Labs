name: Bug report
description: Something behaves differently from what the documentation says
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report.

        **If this is a way to get patient data into a `Goal`, or past the egress
        boundary, please do not file it here.** Use
        [private reporting](https://github.com/comeni-project/Comeni-Labs/security/advisories/new)
        instead — see [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: |
        The exact command, and the goal file if there is one. Remember that a goal
        holds no filenames or sample identifiers, so it should be safe to paste
        verbatim — please check before you do.
      render: shell
      placeholder: |
        uv run mendel build --goal my-goal.yml --out build/
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: What Mendel printed
      description: The full stderr output.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `git rev-parse --short HEAD`, or the release tag.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Output of `uv run python -V`, plus Nextflow and Docker versions if the failure involves a gate.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Before filing
      options:
        - label: I ran `make check` on a clean checkout and it passed
        - label: I have read the relevant page under [docs/](../blob/main/docs/)
