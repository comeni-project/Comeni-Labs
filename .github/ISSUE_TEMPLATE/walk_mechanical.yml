name: "Walk: mechanical"
description: Found while walking — the code does not do what was already agreed
labels: [walk, mechanical]
body:
  - type: markdown
    attributes:
      value: |
        Fixed test-first and closed citing the commit. If fixing it would change what the product
        asks, allows or promises, use **Walk: protocol** instead. See `docs/internals/walking.md`.
  - type: input
    id: where
    attributes:
      label: Scenario, round, model
      placeholder: "scenario 1, round 2, gemma3:12b (local)"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What the page or the engine did, and the phase the session was in.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What was expected
      description: And where that was agreed (a spec, the protocol page, a test).
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Diagnostic codes, requests, `ai_invocation` rows, the code path (`file:line`).
