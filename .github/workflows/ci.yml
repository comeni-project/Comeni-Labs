name: CI

# The fast lane: no Docker, about a minute. This is what gates a pull request, so it
# has to cover the three invariant guards and the determinism tests. The `-stub-run`
# gate needs containers and lives in nightly.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync the workspace
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check .
        # `ruff check` and not `ruff format --check`: 28 files are hand-wrapped in ways
        # the formatter would undo, and a formatting sweep belongs in its own reviewable
        # commit rather than as a wall of noise across every future pull request.

      - name: Tests
        run: uv run pytest -v
        # Includes tests/test_purity.py, tests/test_egress.py and
        # tests/test_construction.py — the three guards — plus the determinism
        # tests, which re-run the build under several PYTHONHASHSEED values.

      - name: Generated type stubs are fresh
        run: uv run python tools/generate_types.py --check
        # A stale stub costs autocomplete and never correctness, which is exactly
        # why nobody would notice it rotting.

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2

      - name: Emit the spine and check it statically
        run: |
          uv run mendel build --goal examples/rnaseq-goal.yml --out build/ --gate lint
          uv run mendel build --goal examples/rnaseq-goal.yml --out build/ --gate preview
        # `lint` is syntax; `preview` is name resolution and dataflow. Neither needs Docker
        # and together they take about 25 seconds. `nextflow lint` alone accepts
        # `STAR_ALIGN.out.NOSUCHCHANNEL`; `-preview` rejects it — measured 2026-08-05.
        #
        # Both invocations also run conformance, so a contract that disagrees with its
        # module fails the pull request before either gate is reached.

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build every distribution
        run: |
          for package in comeni-core mendel-resolver mendel-compiler; do
            uv build --package "$package" --out-dir dist
          done

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          retention-days: 7
