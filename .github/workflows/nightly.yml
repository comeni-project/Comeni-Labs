name: Nightly stub gate

# The slow lane. `-stub-run` executes the whole DAG against real nf-core containers,
# which proves the emitted Nextflow is callable — arity, channel shapes, includes.
# Too slow for a pull request (about 15 minutes on a cold container cache), and too
# important to run only before a release.
#
# Docker is genuinely required even for stubs: nf-core 4.x captures tool versions with
# eval(), which executes regardless of -stub-run.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-docs:
    # `make check` runs this on every pull request, so drift cannot merge. This catches the
    # case that skips that lane entirely — a direct push, or a merge that bypassed checks.
    #
    # A check, never a commit. An Action that regenerated the file would need push rights to
    # a protected branch, and a bypass exists forever and for everything. Worse, a
    # self-healing `main` means nobody ever sees the drift: someone hand-edits the generated
    # table, a bot silently reverts them, and they learn nothing about why it is generated.
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: The generated documentation matches its source
        run: make docs

  stub-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Sync the workspace
        run: uv sync --locked

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@893c28b667aedeba26e37f296d260ccc5bc4d914 # v3.0.1

      - name: Build the RNA-seq spine and run the stub gate
        run: uv run mendel build --goal examples/rnaseq-goal.yml --out build/ --gate stub

      - name: The spine runs on the nf-core test dataset and counts correctly
        run: uv run pytest -m slow -v
        # The gate that answers "does this produce a counts matrix", as opposed to `stub`,
        # which answers "does the DAG execute". nf-core stubs never read their inputs, so only
        # this one can catch a process wired to an empty tuple — which is how the missing
        # reference genome survived a green suite (issue #8). `make check` excludes these;
        # they need Docker and about ten minutes.
        #
        # The dataset is pinned to a commit in the vocabulary's `test_data`, so a result from
        # today is comparable to a result from next year.
        #
        # **This step used to be preceded by a hand-rolled shell version of the same
        # assertion**, which globbed `*.featureCounts.txt`. The vendored module emits
        # `*.featureCounts.tsv` and always has, so the shell step asserted a filename that
        # cannot exist — it failed every night from 2026-08-11 or earlier, and because it ran
        # *first*, this step was skipped and the real check never ran at all. `test_counts.py`
        # was corrected to accept both spellings in `f93b4df`; the workflow was not, because
        # nothing tied them together. One assertion now, in the tests, where it can be run
        # locally by `make verify`.

      - name: Emit a profiling pipeline
        run: uv run mendel profile --have fastq.reads --out profile-build/

      - name: Lint the profiling pipeline too
        run: uv run mendel profile --have fastq.reads --out profile-lint/ --gate lint

      - name: Upload the generated pipelines
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-pipelines
          # `test-build/` is gone with the hand-rolled assertion above: the slow tests build
          # into pytest's own temporary directory, so there is no fixed path to collect. What
          # is uploaded is what a fixed path still produces. If you need a `--gate test` tree
          # to look at, `make verify` builds one locally in about two minutes.
          path: |
            build/main.nf
            build/nextflow.config
            build/pipeline.yml
            profile-build/
          retention-days: 14

      - name: Upload the Nextflow log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nextflow-log
          path: build/.nextflow.log
          retention-days: 14
