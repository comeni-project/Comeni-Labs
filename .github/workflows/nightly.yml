name: Nightly stub gate

# The slow lane. `-stub-run` executes the whole DAG against real nf-core containers,
# which proves the emitted Nextflow is callable — arity, channel shapes, includes.
# Too slow for a pull request (about 15 minutes on a cold container cache), and too
# important to run only before a release.
#
# Docker is genuinely required even for stubs: nf-core 4.x captures tool versions with
# eval(), which executes regardless of -stub-run.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stub-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync the workspace
        run: uv sync --locked

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2

      - name: Build the RNA-seq spine and run the stub gate
        run: uv run mendel build --goal examples/rnaseq-goal.yml --out build/ --gate stub

      - name: Run the spine on the nf-core test dataset
        run: uv run mendel build --goal examples/rnaseq-goal.yml --out test-build/ --gate test
        # The gate that answers "does this produce a counts matrix", as opposed to
        # `stub`, which answers "does the DAG execute". nf-core stubs never read their
        # inputs, so only this one can catch a process wired to an empty tuple — which
        # is how the missing reference genome survived a green suite (issue #8).
        #
        # The dataset is pinned to a commit in the vocabulary's `test_data`, so a result
        # from today is comparable to a result from next year.

      - name: The run produced a counts matrix with counts in it
        run: |
          matrix=$(find test-build/ -name '*.featureCounts.txt' | head -1)
          test -n "$matrix" || { echo "no counts matrix was produced"; exit 1; }
          rows=$(grep -vc '^#' "$matrix")
          echo "counts matrix: $matrix ($rows rows)"
          test "$rows" -gt 1 || { echo "counts matrix has no rows"; exit 1; }
          head -3 "$matrix"

      - name: The spine counts correctly on the test dataset
        run: uv run pytest -m slow -v
        # `make check` excludes these; they need Docker and about ten minutes. This is the
        # only gate that can catch a pipeline which runs and computes the wrong numbers —
        # -stub-run cannot, because nf-core stubs never read their inputs.

      - name: Emit a profiling pipeline
        run: uv run mendel profile --have fastq.reads --out profile-build/

      - name: Lint the profiling pipeline too
        run: uv run mendel profile --have fastq.reads --out profile-lint/ --gate lint

      - name: Upload the generated pipelines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-pipelines
          path: |
            build/main.nf
            build/nextflow.config
            build/pipeline.ir.json
            test-build/main.nf
            test-build/pipeline.ir.json
            test-build/results/
            profile-build/
          retention-days: 14

      - name: Upload the Nextflow log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nextflow-log
          path: build/.nextflow.log
          retention-days: 14
