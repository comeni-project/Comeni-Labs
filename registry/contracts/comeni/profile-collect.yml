# The collector: measurements in, one profile file out. `mendel profile` does not
# route this — it wants the measurements themselves — but the laboratory runs the
# emitted pipeline and this is where the values are gathered.
id: comeni/profile/collect@0.1.0
roles: [profiling]
nf_process: MULTIQC
nf_include: modules/nf-core/multiqc/main
consumes: [{name: measurements, type_id: measurement.read_length, state_required: []}]
# `data` is MultiQC's `*_data` directory, where the parsed per-tool values land. The
# port name is the emit label the compiler reads as `MULTIQC.out.<name>`; `profile`
# was neither a channel MultiQC declares nor one it could be made to declare.
produces: [{name: data, type_id: profile.yml, state: []}]
params: []
priority: 0
nf_inputs: [{ports: [measurements]}]
container: community.wave.seqera.io/library/multiqc:1.35--c17fb751507e9dfc
provenance: {source: hand, drafted_by: hand, approved_by: rafael, approved_at: "2026-08-03"}
