id: nf-core/star/align@1.11.0
roles: [alignment]
nf_process: STAR_ALIGN
nf_include: modules/nf-core/star/align/main
consumes:
  - name: reads
    type_id: fastq.reads
    state_required: []
    state_required_conventional: [trimmed]
    state_conventional_because: >-
      STAR soft-clips adapter sequence rather than requiring it removed, and
      nf-core/rnaseq ships --skip_trimming precisely because trimming is optional.
      So trimming is a convention worth keeping by default and not a constraint:
      declaring it structural made a rule that skips trimming produce an unroutable
      pipeline rather than a shorter one.

  - {name: index, type_id: genome.index.star, state_required: []}
  - {name: gtf, type_id: annotation.gtf, state_required: []}
produces: [{name: bam, type_id: alignment.bam, state: []}]
params:
  # STAR builds its own read-group line unless `ext.args` already contains the flag:
  #   attrRG = args.contains("--outSAMattrRGline") ? "" : "--outSAMattrRGline 'ID:$prefix' ..."
  # So supplying it suppresses the module's, and this template must carry ID and SM too —
  # routing only the PL fragment would silently drop the read group STAR needs.
  - name: seq_platform
    tier_hint: 4
    # No `domain`, deliberately. The list of sequencing platforms cannot be
    # enumerated — a param whose legal values are open declares none, and
    # `_computed_over`'s heuristic remains its only check. Spec §7.1.
    via: ext
    key: args
    template: "--outSAMattrRGline 'ID:${meta.id}' 'SM:${meta.id}' 'PL:{value}'"
  - name: star_ignore_sjdbgtf
    default: false
    domain: {kind: boolean}
    because: >-
      Align *with* the annotation. The GTF is routed into this module, and ignoring it would
      discard the splice-junction information a spliced aligner exists to use. A laboratory
      aligning against a genome whose annotation it does not trust wants this true. Audit
      A91: it was a hardcoded `false` in the call, outside the tier ladder and answerable by
      nobody, because no route reached a bare `val`.
    via: positional
# STAR is the nf-core/rnaseq default aligner, so this registry prefers it by
# convention (tier 2). A tier-3 rule keyed on read_length supersedes this with a
# citation once the rule format lands.
priority: 10
priority_because: >-
  nf-core/rnaseq's default aligner, so this registry prefers it by convention where no
  measurement distinguishes the candidates. Ranked above HISAT2 rather than beside it: the
  tier-3 rule below decides on read length where one is measured, and this is what answers
  when none is.
# tuple(meta, reads) | tuple(meta2, index) | tuple(meta3, gtf) | val ignore_sjdbgtf
nf_inputs:
  - {ports: [reads]}
  - {ports: [index]}
  - {ports: [gtf]}
  - {param: star_ignore_sjdbgtf}
ext_args:
  template: "--readFilesCommand zcat"
  because: >-
    The reads reaching STAR in this registry are gzipped, and STAR reads plain text unless
    told otherwise. Stated as a premise about the *reads* rather than as a fact about
    TrimGalore, which is how it was written before: one goal edit — declaring the reads
    already trimmed — removes TrimGalore from the pipeline while this flag survives, and the
    old reason then named a module that was not there. Audit A82. **Where this is false it is
    actively wrong and nothing here will catch it**: a laboratory supplying uncompressed
    trimmed reads needs this removed. Expressing that as a condition is issue #39's
    `when`-expressiveness problem, not this field's.
container: community.wave.seqera.io/library/htslib_samtools_star_gawk:ae438e9a604351a4
provenance: {source: nf-core-meta-yml, drafted_by: hand, approved_by: rafael, approved_at: "2026-08-03"}
