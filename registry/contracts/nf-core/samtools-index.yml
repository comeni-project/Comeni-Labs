id: nf-core/samtools/index@1.21.0
roles: [bam_indexing]
nf_process: SAMTOOLS_INDEX
nf_include: modules/nf-core/samtools/index/main
consumes: [{name: bam, type_id: alignment.bam, state_required: [coordinate_sorted]}]
# An index is a sidecar file, not a BAM. Modelling it as alignment.bam[indexed] is
# what let the router hand featureCounts a .bai — see the 2026-08-03 audit, C4.
# nf-core SAMTOOLS_INDEX emits bai/csi/crai and no BAM at all, so there is no
# honest passthrough output to declare either.
# The port *name* is the emit label — the compiler reads `SAMTOOLS_INDEX.out.<name>`,
# so it must be `index`, which is what the module calls the channel. The semantic type
# stays `alignment.bai`. This said `bai` until conformance checking compared it to the
# module: latent only because no goal has yet routed to an index.
produces: [{name: index, type_id: alignment.bai, state: []}]
params: []
priority: 0
nf_inputs: [{ports: [bam]}]
container: community.wave.seqera.io/library/htslib_samtools:1.24--d697cfb9dce007cd
provenance: {source: nf-core-meta-yml, drafted_by: hand, approved_by: rafael, approved_at: "2026-08-03"}
