id: nf-core/hisat2/build@2.2.2
roles: [index_building]
nf_process: HISAT2_BUILD
nf_include: modules/nf-core/hisat2/build/main
consumes:
  - {name: fasta, type_id: genome.fasta, state_required: []}
  - {name: gtf, type_id: annotation.gtf, state_required: []}
produces: [{name: index, type_id: genome.index.hisat2, state: []}]
params: []
priority: 0
# tuple(meta, fasta) | tuple(meta2, gtf) | tuple(meta3, splicesites)
nf_inputs:
  - {ports: [fasta]}
  - {ports: [gtf]}
  - {empty: 2, because: "splicesites are optional; HISAT2_EXTRACTSPLICESITES is not vendored"}
container: quay.io/biocontainers/hisat2:2.2.2--h503566f_0
provenance: {source: nf-core-meta-yml, drafted_by: hand, approved_by: rafael, approved_at: "2026-08-03"}
