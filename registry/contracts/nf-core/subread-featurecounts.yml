id: nf-core/subread/featurecounts@2.0.6
nf_process: SUBREAD_FEATURECOUNTS
nf_include: modules/nf-core/subread/featurecounts/main
consumes:
  - {name: bam, type_id: alignment.bam, state_required: [coordinate_sorted]}
  - {name: annotation, type_id: annotation.gtf, state_required: []}
produces: [{name: counts, type_id: counts.matrix, state: [gene_level]}]
# Strandedness is NOT a param, and must not become one: it arrives through
# `meta.strandedness`, which this module already translates into `-s`. A Param for it would
# resolve to a value that reaches nothing, which is the defect this registry exists after.
#
# `min_mqs` is a genuine setting and is declared rather than left to the tool: featureCounts
# discards reads below this mapping quality, so a laboratory comparing two runs needs it
# written down. 0 is featureCounts' own documented default, so declaring it changes no
# number — it makes the threshold part of the record instead of part of the tool.
params:
  - name: min_mqs
    default: 0
    via: ext
    key: args
    template: "-Q {value}"
priority: 0
# The GTF is one annotation for every sample, so pairing each BAM against it is exactly what
# is wanted and `broadcast` says so out loud. This was the emitter's unconditional default:
# correct here, and silently a cross product for any second *per-sample* port. Audit A92.
nf_inputs: [{ports: [bam, annotation], join: broadcast}]
container: quay.io/biocontainers/subread:2.1.1--h577a1d6_0
provenance: {source: nf-core-meta-yml, drafted_by: hand, approved_by: rafael, approved_at: "2026-08-03"}
