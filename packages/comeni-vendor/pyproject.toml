[project]
name = "comeni-vendor"
version = "0.1.0"
requires-python = ">=3.12"
description = "Fetch a tool's source into a registry layer, and check it still matches its pin"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{name = "Rafael Correia"}]
keywords = ["bioinformatics", "nextflow", "workflow", "reproducibility", "pipeline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]

# Lower bounds, no caps — see mendel-resolver's manifest and docs/guides/releasing.md.
# `comeni-core` for the `Module` shape and `coded()`, and nothing else. This package holds no
# resolver and no compiler: it puts source into a layer, and a build reads a layer on disk.
dependencies = [
  "comeni-core>=0.1.0",
  "pydantic>=2.9",
  "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/comeni-project/Comeni-Labs"
Documentation = "https://github.com/comeni-project/Comeni-Labs/tree/main/docs"
Repository = "https://github.com/comeni-project/Comeni-Labs"
Issues = "https://github.com/comeni-project/Comeni-Labs/issues"
Changelog = "https://github.com/comeni-project/Comeni-Labs/blob/main/CHANGELOG.md"

[project.scripts]
comeni-vendor = "comeni_vendor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/comeni_vendor"]

[tool.uv.sources]
comeni-core = { workspace = true }
