[project]
name = "wiener-core"
version = "0.1.0"
requires-python = ">=3.12"
description = "Run state, folded from events. Pure."
dependencies = ["comeni-core>=0.1.0", "pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wiener_core"]

[tool.uv.sources]
comeni-core = { workspace = true }
