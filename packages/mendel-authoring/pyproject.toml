[project]
name = "mendel-authoring"
version = "0.1.0"
requires-python = ">=3.12"
description = "The authoring protocol — the diagram the engine runs — and its interpreter. Pure."
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{name = "Rafael Correia"}]

# A lower bound and no cap, as `mendel-resolver` argues (docs/internals/releasing.md).
dependencies = ["comeni-core>=0.1.0", "comeni-flow>=0.1.0", "pydantic>=2.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mendel_authoring"]

[tool.uv.sources]
comeni-core = { workspace = true }
comeni-flow = { workspace = true }
