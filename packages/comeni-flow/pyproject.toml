[project]
name = "comeni-flow"
version = "0.1.0"
requires-python = ">=3.12"
description = "A declarative flow engine: stages, nodes and arrows that are the program, and their interpreter"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{name = "Rafael Correia"}]
keywords = ["bioinformatics", "nextflow", "workflow", "reproducibility", "pipeline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]

# Lower bounds follow the repository's package policy; see docs/how-to/development/release.md.
# Pure: no network, files, clock or database. Core supplies coded diagnostics.
dependencies = [
  "comeni-core>=0.1.0",
  "pydantic>=2.9",
]

[project.urls]
Homepage = "https://github.com/comeni-project/Comeni-Labs"
Documentation = "https://github.com/comeni-project/Comeni-Labs/tree/main/docs"
Repository = "https://github.com/comeni-project/Comeni-Labs"
Issues = "https://github.com/comeni-project/Comeni-Labs/issues"
Changelog = "https://github.com/comeni-project/Comeni-Labs/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/comeni_flow"]

[tool.uv.sources]
comeni-core = { workspace = true }
