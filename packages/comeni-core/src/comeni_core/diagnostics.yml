# The diagnostic registry. One entry per code.
#
# `docs/reference/cli.md`'s table is GENERATED from this file — do not edit it by hand.
# Regenerate with: uv run python tools/generate_diagnostics_doc.py
#
# `MD` is Mendel's deterministic core: the three packages that may not reach the network.
# `MF`, `MA` and `MI` belong to the forge, the API and the AI adapters; `N` and `W` are
# reserved for Nightingale and Wiener, so a future Nightingale API is `NA` and cannot collide.
#
# Bands of one hundred group by concern inside a prefix:
#
#   MD0000-MD0099  loading declared registry data          (none yet — Pydantic errors today)
#   MD0100-MD0199  conformance: a contract disagrees with its module
#   MD0200-MD0299  the pipeline file: a setting, an override, or the format
#   MD0300-MD0399  routing and resolution                  (see issue #18)
#   MD0400-MD0499  gates and emission                      (none yet)
#
# A band may overflow into a new band. **A code is never renumbered** — a published code is
# something a laboratory runbook can cite. See docs/internal/specs/2026-08-07-the-pipeline-file.md
# section 10.

MD0100:
  emitted_by: compiler
  concern: conformance
  says: "no module source to check against — **warns, never blocks**; recorded in `pipeline.yml` under `registry.unverified`"
  fires_on: [build]
  refuses: false
  fix: |
    Vendor the module under `vendor/modules/` if you have it, or accept the contract as
    unverified — which is legitimate for a laboratory wrapping a bare container.
  explanation: |
    The contract names a module whose source is not present, so nothing could check
    it. The build continues and the contract is marked unverified, which is recorded
    on the IR and reaches a publish bundle. A curator may refuse to curate an
    unverified contract: a claim about a module, with no module to check it against,
    is a claim without evidence.

MD0101:
  emitted_by: compiler
  concern: conformance
  says: "`nf_process` is not the process the module declares"
  fires_on: [build]
  refuses: true
  fix: |
    Set `nf_process` to the process name as written in the module's `main.nf`. Read it out
    of the file — it is `SUBREAD_FEATURECOUNTS`, not `FEATURECOUNTS`.
  explanation: |
    `nf_process` must be the process name as written in the module's main.nf. The
    emitted workflow calls it by that name, so a mismatch fails at launch with
    'process not found' — after the containers have been pulled.

MD0102:
  emitted_by: compiler
  concern: conformance
  says: "`nf_inputs` declares a different number of channels than the process takes"
  fires_on: [build]
  refuses: true
  fix: |
    Count the `input:` declarations in the module's `main.nf` and declare one `nf_inputs`
    entry per channel — not one per contract port.
  explanation: |
    `nf_inputs` declares one entry per channel the process takes. A contract port is
    not a process argument: featurecounts takes one channel carrying two ports, and
    samtools/sort takes three of which two model nothing. Nextflow matches arity, so
    a mismatch fails at launch.

MD0103:
  emitted_by: compiler
  concern: conformance
  says: "an `{empty: N}` placeholder is the wrong tuple width"
  fires_on: [build]
  refuses: true
  fix: |
    Count the elements in the module's `tuple` declaration for that slot and set `empty`
    to that width.
  explanation: |
    `NfInput.empty` is a tuple *width*, not a count of channels. Nextflow matches
    arity: a 2-tuple handed to a slot declared `tuple val(meta), path(fasta),
    path(fai)` dies with 'Path value cannot be null'.

MD0104:
  emitted_by: compiler
  concern: conformance
  says: "a placeholder sits where the module declares `path(...)`, with no `because`"
  fires_on: [build]
  refuses: true
  fix: |
    Either wire a real input into that slot, or add `because:` saying why an empty one is
    correct here. Saying which is the whole check.
  explanation: |
    This slot declares `path(...)`, so the module expects a real file, and the
    contract supplies an empty placeholder. Sometimes that is correct — samtools/sort
    only needs a reference to write CRAM — and sometimes it is a hole: STAR was called
    with no genome for weeks, through a green test suite and a passing stub gate.
    Saying which, in `because`, is the whole check.

MD0105:
  emitted_by: compiler
  concern: conformance
  says: "a `produces[].name` is not one of the module's `emit:` labels"
  fires_on: [build]
  refuses: true
  fix: |
    Set `produces[].name` to the module's `emit:` label. It is the emit label, not a name
    for the semantic thing — that is what `type_id` carries.
  explanation: |
    The emitted workflow reads `PROCESS.out.<name>` for each produced port, so every
    `produces[].name` must appear in the module's `emit:` labels. A mismatch fails at
    runtime against a channel that does not exist.

MD0106:
  emitted_by: compiler
  concern: conformance
  says: "a `meta` key the module reads that nothing declares, or a declared `meta_key` no module reads"
  fires_on: [build]
  refuses: true
  fix: |
    Declare the measurement with a `meta_key` for that key, or remove the `meta_key` that
    no module reads.
  explanation: |
    Measured facts reach nf-core modules through the `meta` map, and a module reading
    a key nothing sets silently uses its default. That is how featureCounts computed
    -s 0 for a reverse-stranded library and produced a matrix of wrong numbers while
    every gate stayed green. The reverse also matters: a `meta_key` no module reads is
    a declaration with no effect.

MD0107:
  emitted_by: compiler
  concern: conformance
  says: "`container` has drifted from the module's directive"
  fires_on: [build]
  refuses: true
  fix: |
    Copy the container from the module's `container` directive. Take the *last* quoted
    string in the ternary: nf-core 4.x puts singularity first and docker second.
  explanation: |
    The container must match the module's `container` directive exactly. A contract
    claiming a container the module does not use is claiming a reproducibility it does
    not have. Take the *last* quoted string in the ternary: nf-core 4.x puts
    singularity first and docker second.

MD0108:
  emitted_by: compiler
  concern: conformance
  says: "a setting routes to an `ext` key this module never reads"
  fires_on: [build]
  refuses: true
  fix: |
    Route the setting somewhere the module reads, or drop it. A value that reaches no tool is
    the defect `via:` exists to remove, and a declared route is not a true one.
  explanation: |
    A contract is a hand-written FFI binding, and this is the binding naming a destination that
    does not exist. `via:` made a route **declared**; it did not make it **true**.

    A setting routed to `ext.args` on a module whose script never mentions `task.ext.args`
    behaves exactly like the dead `params.<node>_<name>` line issue #10 was about: the resolver
    runs, the value is recorded, the pipeline behaves identically whatever it is. Wearing the
    fix, which makes it harder to see rather than easier.

    Cheap to check, which is why it lands on day one rather than waiting for a Groovy parser:
    `modulespec.py` already looks for `task.ext.args` and `task.ext.prefix` as substrings of
    the module source. Three of the ten vendored modules ignore `task.ext.prefix`, so the
    prefix half has real negatives — a check that can only pass is not a check.

    Build-only, because it needs module source. `mendel emit` does not read any, by design.

    Only `args`, `args2`, `args3` and `prefix` are checkable this way. `via: meta` and
    `via: directive` are Nextflow's own mechanisms rather than the module's, and `MD0209`
    already guards directive names against the same class of mistake.

MD0200:
  emitted_by: compiler
  concern: pipeline-file
  says: "a setting declares no `via:`, so nothing would carry its value"
  fires_on: [build, emit, upgrade]
  refuses: true
  fix: |
    Add `via:` naming where the value should land — `ext` with a `key:`, `meta`, or `directive`.
  explanation: |
    A setting the resolver decides has to reach the tool somehow. Before this was required, a
    resolved value became a `params.<node>_<name>` line in the emitted workflow that no module
    reads: the resolver ran, flagged tier 4, printed REVIEW, and the pipeline behaved
    identically whatever the answer was.

    Emptiness and deadness are different problems. Few parameters is emptiness, and the forge
    fixes it. A resolved value reaching no tool is deadness, and no amount of forge output
    fixes that — only a declared route does.

MD0201:
  emitted_by: compiler
  concern: pipeline-file
  says: "a resolved value is outside the substitutable character class"
  fires_on: [build, emit, upgrade]
  refuses: true
  fix: |
    Use letters, digits and `_ . : + -` only, or a number, or true/false.

    If your value legitimately needs a space or a slash, that is a case we assumed did not
    exist rather than one we decided to forbid. Please report it, with the tool and the flag:
    https://github.com/comeni-project/Comeni-Labs/issues
  explanation: |
    A template substitutes {value} into a string that becomes part of a shell command line.
    Rather than escape dangerous characters, Mendel refuses them: escaping-for-context is where
    injection bugs live, and a value that cannot contain a quote cannot close one.

    The class is deliberately narrow, on the stated assumption that almost no tool setting needs
    a space or a slash. That assumption has not met a real counterexample, which is why this
    message asks for one.

    Loosening the class later is backward-compatible — every file that validated still
    validates. Tightening it is not, because files already on disk would stop loading. So it
    starts strict, and the three excluded classes are not equally cheap to admit later: a slash
    is inert here and needs only a wider pattern; a space needs the substituted value
    shell-quoted at emit time, which moves every argument string; and a quote, dollar, backtick,
    semicolon or newline should stay excluded, because those are the reason this refuses rather
    than escapes.

MD0202:
  emitted_by: compiler
  concern: pipeline-file
  says: "a replayed value is frozen against a contract that has since been edited"
  fires_on: [upgrade]
  refuses: false
  fix: |
    Nothing, if you meant it — replaying is what keeps an upgrade honest, and a value that
    does not move is the whole point of a recorded decision.

    Read the contract's diff and decide. If the edit changed what the setting means rather
    than what it defaults to, clear the recorded decision so the value is resolved afresh.
  explanation: |
    `DRIFT` says a contract you pinned has been edited. This says which of your values were
    decided against the version before that edit and are being carried forward regardless.

    Both are true and neither implies the other. A contract can be edited in ways that touch
    nothing this pipeline uses, and a value can be replayed from a contract that has not moved
    at all. Reporting only the first leaves a reader to work out the consequence, which is the
    part that actually affects the numbers a tool produces.

    It reports rather than refuses because replaying is correct. Invariant 9 is that records
    are replayed on rerun rather than re-asked — that is how determinism survives having a
    model in the loop — so a frozen value is the system working. What a person is owed is
    knowing it happened, not being stopped.

MD0203:
  emitted_by: compiler
  concern: pipeline-file
  says: "an override answers a question this re-resolution never asks"
  fires_on: [upgrade]
  refuses: true
  fix: |
    Decide what the answer was for. If the step it belonged to is gone, delete the override
    from `decisions:` — that is a real edit and it should look like one. If the step should
    still be there, the goal or the registry moved in a way you did not intend, and the
    upgrade is what caught it.
  explanation: |
    Two things can happen to a recorded answer when a pipeline is re-resolved against a newer
    registry, and they are not the same event.

    **Stale** — the question is still asked, but its options moved, so the recorded answer no
    longer fits. Re-asking is correct: replaying would assert a choice between options that no
    longer exist, which is worse than asking again because it would look decided. That is
    reported as STALE and flagged tier 4. It does not refuse.

    **Orphaned** — the question is never asked at all. The step is gone, or the value stopped
    being ambiguous because a rule now covers it. `resolve()` is never called for it, so no
    resolver hook can see it; it is found by taking the complement of what this run was asked.
    That refuses.

    The difference is whether there is still a question. An override that silently stops
    applying is the same failure as a guard that silently stops guarding, which is audit A14's
    shape — so this one is loud, and it is the only one of the two that stops the upgrade.

    Only a *human's* answer can be orphaned. A resolver's recorded choice for a step that no
    longer exists is nothing at all, and nobody is owed a report about it.

MD0204:
  emitted_by: compiler
  concern: pipeline-file
  says: "a `template:` never mentions `{value}`, or sits on a route that takes none"
  fires_on: [build, emit, upgrade]
  refuses: true
  fix: |
    Put `{value}` in the template where the resolved value belongs — or drop the template, if
    the route takes one typed value rather than an argument string.
  explanation: |
    Two mistakes with one shape: a setting that looks wired and is not.

    A template on `ext.args` that forgets `{value}` renders real flags and discards the value.
    That is harder to spot than an honest no-op precisely because it looks correct — flags do
    reach the tool, just not yours.

    A template on `prefix`, `meta` or a directive has nothing to compose into. Those carry one
    typed value; `cpus = "--cpus 12"` is not a thing.

MD0205:
  emitted_by: compiler
  concern: pipeline-file
  says: "`via:`/`key:` are not a legal pair — including `key: when`"
  fires_on: [build, emit, upgrade]
  refuses: true
  fix: |
    `via: ext` needs a `key:` of `args`, `args2`, `args3` or `prefix`. Every other route takes
    no key at all.
  explanation: |
    The `ext` scope is a keyspace; `meta` and `directive` are single destinations. A key on
    either of those names nothing.

    `when` is not a legal key on purpose. `ext.when` is a boolean that skips a process
    entirely, so a setting could switch a step off while the pipeline file still described it
    running — a second routing mechanism competing with resolution. Whether a step exists is
    decided by resolving the goal.

MD0206:
  emitted_by: compiler
  concern: pipeline-file
  says: "the `pipeline.yml` just written does not parse back to the object it was written from"
  fires_on: [build]
  refuses: true
  fix: |
    Nothing you can do in the file — this is a bug in Mendel, and the pipeline directory it
    would have written is not trustworthy. Please report it with the goal that produced it:
    https://github.com/comeni-project/Comeni-Labs/issues
  explanation: |
    Every build writes `pipeline.yml`, reads it back, and emits the Nextflow from the copy it
    read. So the round trip is exercised on every build rather than asserted once in a test,
    and a field that does not survive YAML is a refused build rather than a file that quietly
    means less than it says.

    That is a direct answer to how `ResolvedValue._drop_computed` came to be needed. The IR did
    not round-trip at all, and in that field's own words: nothing noticed, because nothing read
    an IR back until now.

MD0207:
  emitted_by: compiler
  concern: pipeline-file
  says: "`version:` is newer than this Mendel understands"
  fires_on: [emit, upgrade, publish]
  refuses: true
  fix: |
    Upgrade Mendel. Do not edit the version number down — that only moves the failure to
    somewhere less obvious than this message.
  explanation: |
    Forward compatibility is a promise this format has not made. An older Mendel reading the
    parts of a newer file it happens to recognise would emit a pipeline missing whatever the
    unrecognised section carried, and would say nothing, because from its point of view the
    file parsed.

    Refusing is the honest reading of an unknown document, and it is why `version:` is the
    first key in the file.

MD0209:
  emitted_by: compiler
  concern: pipeline-file
  says: "`via: directive` names something Nextflow silently ignores"
  fires_on: [build, emit, upgrade]
  refuses: true
  fix: |
    Use a process directive Nextflow accepts. `ext` is not one of them here — `via: ext` owns
    that scope, and a setting must not reach it by two routes.
  explanation: |
    An unknown directive inside a `withName` block is silently ignored by Nextflow. Measured
    rather than assumed: a config carrying `process { withName: FOO { cpuz = 4 } }` runs to
    exit 0 with no error and no warning on Nextflow 25.10.4.

    That is the exact failure this design exists to remove, so a routed directive whose name
    was never checked would reinstall it — a resource setting that does nothing, reported by
    nobody.

    The legal names live in the compiler rather than the registry: Nextflow's directive set is
    a fact about the toolchain, moving on Nextflow's release cycle, and no laboratory should be
    able to approve `cpuz` into it by editing data.

MD0210:
  emitted_by: compiler
  concern: pipeline-file
  says: "`modules/` is absent, so the emitted `include` paths would point at nothing"
  fires_on: [emit]
  refuses: true
  fix: |
    Run `mendel emit` in the pipeline directory `mendel build` produced, keeping `modules/`
    beside `pipeline.yml`. The module source is part of the pipeline, not a build artifact.
  explanation: |
    `include { STAR_ALIGN } from 'modules/nf-core/star/align/main'` is resolved by Nextflow at
    launch, not by Mendel at emit time. Writing a `main.nf` whose includes cannot resolve
    produces a file that looks finished and fails at the first run, with an error about a
    module path rather than about a missing directory.

    Never emit a `main.nf` that cannot run. This is the same rule as `NfInput.empty` requiring
    a reason, applied to the directory instead of to a channel.

MD0211:
  emitted_by: compiler
  concern: pipeline-file
  says: "`channels[].params` disagrees with what its `expression` references"
  fires_on: [build, emit, upgrade, publish]
  refuses: true
  fix: |
    Make `params:` list exactly the `params.<name>` that `expression:` reads. Edit whichever of
    the two is wrong — they answer the same question and the file must not answer it twice.
  explanation: |
    `params:` is stored and also derivable, deliberately. Taking a scan over arbitrary Groovy
    out of the emitter is much of what materialising the pipeline buys, and the emitter's copy
    of that scan lives in a package that may use a regular expression while `comeni-core` may
    not.

    The price of the duplication is that the two spellings must be checked against each other,
    on every load rather than only where they were written together. Two implementations of one
    computation is how a guard comes to be testing its own copy — audit A21 — so here they are
    compared instead.

MD0212:
  emitted_by: compiler
  concern: pipeline-file
  says: "two steps share an `id`, or two settings on one step share a `name`"
  fires_on: [build, emit, upgrade, publish]
  refuses: true
  fix: |
    Give each step a distinct `id`, and each setting on a step a distinct `name`.
  explanation: |
    A11 arriving in a new type. `ModuleContract` already refuses a duplicate `Param`, because
    the second one silently wins and nothing says so.

    Here it is worse than ambiguous. A step `id` is what `inputs[].source` points at, so a
    duplicate makes the wiring itself unreadable. And `ext.args` composition sorts the settings
    by name and joins them, so two settings with one name are two fragments the emitter would
    concatenate into a single flag string without comment.

MD0213:
  emitted_by: compiler
  concern: pipeline-file
  says: "`pipeline.yml` has changed since the Nextflow was generated from it"
  fires_on: [emit, publish]
  refuses: false
  fix: |
    Run `mendel emit <dir>/pipeline.yml --out <dir>`. That regenerates `main.nf` and
    `nextflow.config` from what the file now says, and restamps `emitted.from_digest`.

    `emit` reports this and then cures it, so seeing it there is normal — it is the record of
    what your edit changed. Any verb that treats the generated files as evidence refuses
    instead, because a gate result or a published bundle describing a `main.nf` built from a
    different `pipeline.yml` is evidence about nothing.
  explanation: |
    Consolidating four artifacts into one opens a failure the four did not have, and it is the
    one this whole design exists to prevent: Nextflow runs `main.nf`, not `pipeline.yml`.

    Edit the file you were told to edit, forget to re-emit, and the pipeline that runs is not
    the pipeline that is documented — with every file digest matching, because the bytes on
    disk are exactly the bytes that were written. The artifact and the run diverge in silence,
    through the door the design itself installs.

    So `emitted.from_digest` records the pipeline content the generated files came from,
    computed over the model with `emitted:` excluded, and this fires when the file no longer
    digests to it.

    **It does not fire when the schema moved rather than the file.** `from_digest` hashes the
    model dump, so adding one field to the artifact moves it for every pipeline ever archived,
    at once, with nobody having touched one. Plan 1.13 added `CallArg.join` and this began
    reporting untouched files as edited — while their `main.nf` and `nextflow.config` still
    hashed exactly to their records, which is what said the pipeline had not changed.

    `emitted.schema_version` records the `SCHEMA_VERSION` the digest was taken under, so that
    case is now a note rather than this code: *predates the current schema … its generated
    files are unaffected and were checked … run `mendel emit` to restamp it.*

    **The honest limitation:** for a file written under an older schema the digest cannot match
    either way, so a hand edit and the schema move are indistinguishable *by this mechanism*
    until it is restamped. `MD0214` still checks the generated files against their own
    digests, which is the corruption that actually matters, and it is unaffected by schema
    version. Audit-adjacent, but found while executing Plan 1.13 rather than by the audit.

MD0214:
  emitted_by: compiler
  concern: pipeline-file
  says: "`main.nf` or `nextflow.config` was edited by hand since it was generated"
  fires_on: [emit, publish]
  refuses: true
  fix: |
    Make the change in `pipeline.yml` and re-emit. Settings, provenance and wiring all live
    there, and only edits made there survive the next `mendel emit`.

    To discard the hand edit instead, delete the file and re-emit — a file that is not there is
    rewritten rather than refused, because nothing is destroyed by writing it.
  explanation: |
    Regenerating would overwrite the edit and say nothing, so this refuses rather than silently
    winning an argument with whoever made it.

    The fix names the other file rather than telling anyone to revert. A person who hand-edited
    `main.nf` was trying to change the pipeline; the file that changes the pipeline is
    `pipeline.yml`. A diagnostic that only forbids is half a diagnostic.

MD0215:
  emitted_by: compiler
  concern: pipeline-file
  says: "an input names neither `source` nor `channel`, or names both"
  fires_on: [build, emit, upgrade, publish]
  refuses: true
  fix: |
    Give the input exactly one origin: `source: <step>.<port>` when an earlier step produces
    it, or `channel: <type_id>` when the laboratory supplies it.
  explanation: |
    Two declared fields rather than one string with two shapes. The specification drafted this
    as a single `from:` carrying either `trimgalore.reads` or `channel:annotation.gtf`, and the
    second cannot be an `EdgeRef` — that mark requires two Groovy identifiers, so the union
    would have had to give up the validation that makes an edge reference distinguishable from
    a filename in the first place (audit A16).

    A field that reads two ways is root G, and `inputs:` is where a second reading produces a
    silently miswired pipeline rather than a parse error.

MD0216:
  emitted_by: compiler
  concern: pipeline-file
  says: "a resolved binding names a parameter its contract does not declare"
  fires_on: [build, emit, upgrade, publish]
  refuses: true
  fix: |
    The value has nowhere to go: a route is declared on the contract's `Param`, and there is
    no `Param` by that name. Either the contract dropped the parameter and the binding is
    left over from an older resolution, or the binding names it wrongly.
  explanation: |
    Materialisation used to drop such a binding **silently**, which is the orphan case one
    level below `MD0203`: a value resolution recorded, absent from the artifact that claims to
    record every value, with nothing said.

    Found by a guard that passed for the wrong reason. An `A27` test smuggled prose through a
    binding on `nf-core/samtools/sort`, and that contract declares `params: []` — so the
    binding was discarded before anything validated it, and the test was asserting nothing.

    Resolution cannot produce one: it sets parameters *from* `contract.params`. So this takes
    a deserialised or hand-built IR, and in that case refusing is right — nothing legitimate
    reaches it, and what does reach it is a pipeline file describing a value that will not
    exist in the Nextflow.

MD0217:
  emitted_by: compiler
  concern: pipeline-file
  says: "a test_data reference contains a character that would inject into the generated config"
  fires_on: [build, emit, upgrade]
  refuses: true
  fix: |
    `test_data` is a public reference to a small example dataset — a URL pinned to a commit is
    the canonical form. Remove quotes, backticks, `$`, braces, and whitespace: none belongs in
    a reference, and each is a way into the Groovy that `params.<type>` is emitted as.
  explanation: |
    A44. `test_data` is rendered into the `test` profile as `params.<type> = <value>`, which is
    Groovy, not data. It reached that line double-quoted and unescaped, so a value carrying a
    quote closed the string and the rest ran — at `nextflow config` time, before any pipeline
    executed. Reachable by hand-editing `pipeline.yml` and by an installed registry overlay.

    Two fixes, and this is the first. The emitter now single-quotes and escapes the value like
    any other literal, so even a value that reached it is inert text. This refusal is the
    second: a reference is not a place for a shell metacharacter, and refusing names the
    mistake rather than silently rewriting it. The URL *scheme* is deliberately not dictated —
    a laboratory bringing its own type may host its example anywhere — so only the injection
    surface is refused, not the shape.

MD0208:
  emitted_by: compiler
  concern: pipeline-file
  says: "two writers for one destination — a non-composing `ext` key, or a meta key a measurement already writes"
  fires_on: [build, emit, upgrade]
  refuses: true
  fix: |
    Two writers reach one destination that takes a single value. For an `ext` key: `args`,
    `args2` and `args3` concatenate their fragments on purpose, but every other key — `prefix`
    above all — takes one value, so a second setting silently wins; remove one or route it
    elsewhere. For a `via: meta` setting whose name a measurement already sets (`single_end`,
    `strandedness`): rename the setting, or let the measurement carry the fact.
  explanation: |
    A40. Two writers for one destination is a refusal, not a precedence rule nobody remembers.

    The `ext` half: `_ext_scope` joins a key's fragments with a space, which is exactly right
    for the `args` family and exactly wrong for a key that names one thing — two settings on
    `prefix` emitted `ext.prefix = 'beta' 'alpha'`, a value neither author wrote. `MD0212`
    catches two settings that share a *name*; this catches two that share a *destination* under
    different names, which the composition step made silent rather than ambiguous.

    The `meta` half: a `via: meta` setting and a `Measurement.meta_key` write to the same map,
    and the setting's `.map` runs after the measurement's, so a decision would silently
    overwrite a measured fact. The check is deliberately conservative — any measurement key
    present in the pipeline collides with a meta setting of that name, without tracing which
    channel reaches which step — because an over-strict refusal here costs a rename and a silent
    overwrite costs a wrong result.

MD0218:
  emitted_by: compiler
  concern: pipeline-file
  says: "a tier-4 answer is written in two places that disagree"
  fires_on: [build, emit, upgrade]
  refuses: true
  fix: |
    A parameter's answer lives in `settings[].value` — the field `mendel emit` reads and this
    file tells you to edit. Its decision record also has a `human_override`, and the two say
    different things. Remove the `human_override`, or set it equal to the value.
  explanation: |
    A46. A tier-4 parameter had two homes for its answer: `settings[].value`, which `emit` reads,
    and `decisions[].human_override`, which `upgrade` replays. Editing one and not the other made
    the same `pipeline.yml` mean two different pipelines depending on the verb — with no
    diagnostic. `settings[].value` is now the single writable answer; `upgrade` derives the
    override from it, and a stored `human_override` that contradicts it is refused rather than
    silently preferred by whichever verb runs.

MD0219:
  emitted_by: compiler
  concern: pipeline-file
  says: "two decision records share one key"
  fires_on: [build, emit, upgrade]
  refuses: true
  fix: |
    A key names one decision. Two records for it is a corrupt file — a tool appended rather
    than edited, most likely. Keep the one that carries the answer you meant and delete the
    other.
  explanation: |
    A52. `ReplayResolver` keyed its records with `setdefault`, so the first record for a key
    won and a second was dropped in silence. When the dropped one carried a person's
    `human_override` and the kept one did not, editing a file by appending rather than in place
    destroyed the answer with no diagnostic. Its own comment called two records for one key a
    corrupt bundle whose arbitrary resolution "would be the coin flip invariant 8 forbids" — so
    it is refused at load rather than resolved by first-wins.

MD0220:
  emitted_by: compiler
  concern: pipeline-file
  says: "a setting claims source: human with no override recording the answer"
  fires_on: [build, emit, upgrade]
  refuses: true
  fix: |
    A setting says `source: human`, which is the mark that a person answered an ambiguity and
    which clears that item from review. But no decision records the answer — its
    `human_override` is null or absent. Either set the matching decision's `human_override` to
    the value (the honest override), or restore the `source` that resolution gave the setting.
  explanation: |
    A54. `why.source: human` is a claim about evidence: it says resolution met a real ambiguity,
    flagged it, and a person settled it in the artifact — and `needs_review()` drops the item
    because of that claim. Written straight into `settings[].why` with nothing in `decisions[]`
    recording the answer, it clears a review by assertion — the difference from a chat window
    that invariant 6 exists to hold. The source is now cross-checked against the decision it
    names: a `human` source must be backed by a `PARAM` decision for the same key with a
    non-null `human_override`. A genuine override sets both, so the honest edit passes; what is
    refused is the port used to relabel a resolver's guess as a person's answer.

MD0221:
  emitted_by: compiler
  concern: pipeline-file
  says: "an untemplated `via: ext` value is outside the substitutable class"
  fires_on: [build, emit, upgrade, publish]
  refuses: true
  fix: |
    Use letters, digits and `_ . : + -` only, or a number, or `true`/`false`. If your value
    legitimately needs a space or a slash, that is a case we assumed did not exist — please
    report it.
  explanation: |
    A setting with `via: ext` and no `template:` is written into `nextflow.config` verbatim,
    inside the `ext.<key>` assignment. Nextflow emits a fragment mentioning `${…}` as a
    **closure**, evaluated once per task on the machine running the pipeline — so a value
    containing `${…}` is not data, it is code, and it runs on the host outside any container.

    `pipeline.yml` is meant to be shared, published and edited. `settings[].value` is the
    field the file's own header points a human at, and `key: prefix` takes no template by
    design — `MD0204` refuses one. So the dangerous shape is also the ordinary shape, and no
    tampering is needed to produce it: that is why this is refused when the file loads,
    before `emit` ever reads it, and again at the branch that would emit the closure.

    This is the same class `MD0201` has always enforced on the *templated* route. Audit A55
    found the untemplated branch had none. An unanswered setting — `value: null` — is not
    affected: it contributes no fragment, and tier 4 is flagged rather than fatal.

MD0222:
  emitted_by: compiler
  concern: pipeline-file
  says: "this pipeline records no `emitted:` block, so its directory cannot be certified"
  fires_on: [publish]
  refuses: true
  fix: |
    Run `mendel emit <pipeline.yml> --out <directory>` first. That regenerates the files from
    this pipeline and records their digests, after which the directory describes itself and
    can be certified.
  explanation: |
    `publish` stamps a gate verdict onto `pipeline.yml`, and that verdict is a claim about the
    files beside it. The only thing tying those files to the pipeline is the `emitted:` block —
    the digests recorded when they were generated. `MD0213` and `MD0214` compare against it.

    A pipeline with no `emitted:` block is a **supported state**: an archived pipeline, or one
    written by hand. But it means there is no evidence, and those two checks have nothing to
    compare — so before this code existed, publish read "nothing to compare" as "nothing
    wrong" and certified whatever `main.nf` happened to be in the directory, recording that
    file's digest as the one this pipeline emitted. An unrelated workflow was certified this
    way at exit 0.

    Two verbs deliberately do not refuse. `emit` is the cure and legitimately regenerates from
    a pipeline with no record. `upgrade` reports that the file predates the emitted-artifact
    record rather than claiming byte-identity — the same distinction, but its output is a
    report a person reads, where publish stamps a verdict onto the artifact itself.

    Audit A70. Publication is the door with no undo.

MD0223:
  emitted_by: compiler
  concern: pipeline-file
  says: "a value was edited and the reason beside it still describes the value it replaced"
  fires_on: [emit, upgrade, publish]
  refuses: true
  fix: |
    Update the setting's `why.reason` to explain the new value, and set `why.for_value` to it:

        - name: min_mqs
          value: 30
          why:
            tier: 2
            source: human
            reason: lab SOP BIOINF-014 requires MAPQ >= 30
            for_value: 30

    Or revert the value. Either is fine; what is refused is the pair disagreeing.
  explanation: |
    `settings[].value` is the field this file's own header points a person at — *"Read it;
    edit it"* — so editing one is the ordinary case rather than the suspicious one. What was
    missing is that the justification beside it did not move with it.

    Measured, not theorised. `min_mqs` edited 0 → 30 emitted `ext.args = '-Q 30'`, which
    discards every read below mapping quality 30 — a real change to which reads are counted —
    while the record still read `tier: 2 / source: resolver / reason: contract default for
    min_mqs`. All three false: not a contract default, not the resolver's doing, not 0. And
    `mendel publish --gate lint` certified it at **exit 0**, through the door with no undo.

    `why.for_value` records the value the reason was written about, so the disagreement is
    representable and therefore checkable. `MD0218`/`MD0220` already did this cross-check for
    tier-4 `ParamDecision`s — only for flagged values, and only in the direction that
    overstates human involvement. This covers the rest.

    **A diagnostic rather than a load-time refusal**, deliberately: refusing at load would
    mean the file a reader is invited to edit cannot be edited. Being told to update the
    reason, in the same breath as being told the edit worked, is the whole point.

    `for_value: null` means "written before this field existed" and is skipped. An archived
    pipeline must still emit, and absence is not disagreement.

    Audit A104, and it is the sharpest finding in the design audit for the product claim:
    the artifact *is* the product, and its explanation was provably false about a value that
    changes results. Under the engine decision it is worse — a person who leaves a stale
    reason does it occasionally and may notice; an agent tuning settings does it
    systematically and does not.

MD0224:
  emitted_by: compiler
  concern: pipeline-file
  says: "a setting fills a positional argument and is unanswered, so the call would read `null`"
  fires_on: [emit, upgrade, publish]
  refuses: true
  fix: |
    Answer the setting in `pipeline.yml`, the same way any tier-4 value is answered:

        - name: star_ignore_sjdbgtf
          value: false
          via: positional

    Or give the parameter a `default:` in its contract, if there is a defensible one.
  explanation: |
    `via: positional` puts a resolved value straight into the process call — the fourth
    destination, for a bare `val` in a module's input block that has no name at the call site.
    An unanswered one would emit `STAR_ALIGN(reads, index, gtf, null)`, and Nextflow fails at
    launch with a message naming neither the setting nor the step.

    This refuses rather than emitting, unlike an unanswered `ext` setting — which contributes
    no fragment and is merely flagged, because tier 4 is *flagged, not fatal* (invariant 6).
    The difference is that an `ext` value's absence leaves a working pipeline missing a flag,
    while a positional one's absence leaves a pipeline that cannot start. Arity is not
    optional.

    Audit A91. Before the positional route existed, these values were contract constants: a
    hardcoded `false` in the call, outside the tier ladder, in no review queue, with no reason
    recorded. Routing one the only way the design then permitted — `via: meta` — produced a
    call carrying two values of the same name that disagreed, and `MD0108` did not catch it
    because it checked `ext` keys only.

MD0301:
  emitted_by: resolver
  concern: routing
  says: "a rule row justifies nothing — no `because` and no `cite`, on the row or the block"
  fires_on: [build, upgrade, profile]
  refuses: true
  fix: |
    Give the row a `because:` saying why *this* answer, a `cite:` naming the evidence, or
    both — they are joined rather than chosen between:

        rows:
          - when: {read_length: "< 70"}
            then: nf-core/hisat2/align@2.2.2
            because: >-
              HISAT2 handles short reads with a far smaller index and memory footprint.
            cite: "Kim et al. 2019, doi:10.1038/s41587-019-0201-4"

    A `because` or `cite` on the enclosing block satisfies this too, but answers a different
    question — see the explanation.
  explanation: |
    Tier 3 is **advisory**, and `CLAUDE.md` says what that means: *"the machinery worked,
    check the premise."* A row with no premise gives a reader nothing to check, and it
    emitted a reason ending in a bare colon — `rule producer_of:alignment.bam matched
    {'read_length': '< 70'}: ` — which reads as a truncation rather than as an absence.

    **A block justifies the axis; a row justifies the choice.** "Read length determines which
    aligner is appropriate" is the axis, and Dobin et al. 2013 is a fair citation for it.
    "HISAT2, because it handles short reads with a smaller index" is the row. One field
    carried both, so the block's citation was printed as the row's reason and the shipped
    registry stated that HISAT2 was chosen because of the paper describing STAR — reachable
    by changing one number in `examples/rnaseq-goal.yml`. Audit A79 and A107, found from
    opposite ends by two reviewers who could not confer.

    `Why.axis_reason` now carries the block's justification beside the row's, so a reader can
    tell the methodology from the choice made under it.

    Audit A78.

MD0300:
  emitted_by: resolver
  concern: routing
  says: "a rule's `then` reads as arithmetic, and `then` is emitted verbatim"
  fires_on: [build, upgrade, profile]
  refuses: true
  fix: |
    Write one row per range with a literal `then`:

        rows:
          - {when: {read_length: ">= 100"}, then: 99}
          - {when: {read_length: ">= 70"},  then: 69}

    If the rule genuinely needs arithmetic over a measurement, that is a change to the rule
    format rather than a value — issue #39, and `docs/design/rule-tables-and-port-logic.md`
    §13.2 is the argument.
  explanation: |
    `then` is a value, not a formula. Nothing between the rule table and `nextflow.config`
    evaluates it, so `then: "read_length-1"` reached the tool as the literal string
    `read_length-1` — resolved at tier 3, cited to a real paper, and left out of the review
    list because a rule had matched. `pipeline.yml` said the splice-junction overhang was
    set; STAR received a word.

    **What used to catch this, and why it was not enough.** Only `MD0201`, a shell-injection
    character class, and only on the spaced spelling `"read_length - 1"`: the class permits
    `-`, so removing the spaces was enough to pass. It also covers one route of three —
    `via: directive` emitted `cpus = 'genome_length / 1000000000 * 4'` unchecked.

    A value that merely *contains* a measurement's name is not refused. `paired-end` is a
    word with a hyphen in it, and `paired` is a declared measurement; what makes a string an
    expression is a measurement sitting next to an operator and a number.

    Audit A118. §13.2 called this case unwritable; it was writable and unrefused, which is
    the more dangerous of the two.

MD0302:
  emitted_by: resolver
  concern: routing
  says: "a contract declares a role no layer in the stack declares"
  fires_on: [build, upgrade, profile]
  refuses: true
  fix: |
    Declare the role, or use one that exists:

        # <layer>/roles/roles.yml
        roles:
          - id: alignment
            description: "Placing reads against a reference"

    A lab that needs a role the public registry does not have declares it in its own overlay;
    `roles/` stacks like every other kind, so an overlay may add to the base without
    replacing it.
  explanation: |
    Invariant 7 — vocabularies are closed — and `roles:` is a vocabulary. An undeclared role
    is not a smaller version of a declared one: nothing else in the stack can route to it,
    no rule can name it in a `presence:` or `implementation:` decision, and the misspelling
    that produced it would otherwise sit in a contract looking exactly like a step somebody
    decided not to build a rule for.

    A role is the thing a decision is *about* — `presence: trimming` says whether a trimming
    step exists at all, which the shipped format could only spell as
    `producer_of: fastq.reads` with `then: null`. Keying decisions on a declared role rather
    than on a type id is what lets a rule say a step should not exist without also deleting
    an unrelated decision that happened to share the type.

    Audit A119 and A123.

MD0303:
  emitted_by: resolver
  concern: routing
  says: "a measurement is declared named `required_states`, which is the goal's own shape"
  fires_on: [build, upgrade, profile]
  refuses: true
  fix: |
    Rename the measurement. A property of the data that happens to concern states is a
    different fact from the states the goal asked for:

        # not this
        <layer>/measurements/required_states.yml
        # this
        <layer>/measurements/detected_states.yml
  explanation: |
    The premise set is one namespace over measurements, goal facts and derived facts, so a
    rule author has one thing to learn rather than three. One namespace means collisions are
    possible, and the only defence against a silent one is to refuse it at load.

    `required_states` is the goal's own shape — what the user asked the output to carry — and
    a rule reading `when: {required_states: …}` is asking about the request, not about the
    data. A measurement of the same name would answer that question with a fact about the
    data instead, and which of the two won would depend on which the loader reached first.
    Neither answer is wrong in isolation; the ambiguity is.

    Refused rather than resolved by precedence because a precedence rule here would be
    correct and invisible: the rule author reading their own table would have no way to see
    which fact their row was testing. Same argument as invariant 8 — a tie is ambiguity, not
    a coin flip.

    Audit A120.

MD0304:
  emitted_by: resolver
  concern: routing
  says: "a derivation has no rows, so it can never fire"
  fires_on: [build, upgrade, profile]
  refuses: true
  fix: |
    Give it a row, or delete it:

        derives:
          - fact: strandedness
            kind: enum
            rows:
              - when: {strandedness: absent}
                then: reverse
                because: >-
                  dUTP protocols dominate current library prep, so reverse is the safer
                  default where nothing measured it — and this records that nothing did
                cite: "Wang et al. 2012, doi:10.1093/bib/bbs046"
  explanation: |
    A derivation with no rows is A122's own shape, one layer down. A122 is a rule that
    validates and can never fire; this is a *fact declaration* that validates and can never
    produce a value. Both read to a reviewer as something the registry supplies, and both
    supply nothing.

    Refused at load rather than reported at resolution, because by resolution the fact is
    simply absent, and nothing downstream can tell an empty derivation from one that was
    never written. That is the same reason the whole of spec §5 refuses at load: the moment
    a defect becomes indistinguishable from an absence, the diagnostic stops being possible.

    **A derivation over a declared measurement is a fallback**, and the asymmetry is the
    whole of it: it may fill a gap and may never overwrite. A version that could overwrite
    would fail in the worst way available — the pipeline resolving against a default while
    `pipeline.yml` printed the measured value beside it.

    Audit A122; spec §3.1.

MD0305:
  emitted_by: resolver
  concern: routing
  says: "a `when` clause uses a mapping predicate nothing implements"
  fires_on: [build, upgrade, profile]
  refuses: true
  fix: |
    The mapping predicates are `not` and `in`:

        when: {strandedness: {not: unstranded}}
        when: {strandedness: {in: [forward, reverse]}}

    For a scalar comparison write the operator inline — `{read_length: ">= 70"}` — and for
    the two questions about whether a fact exists at all, `absent` and `present`.
  explanation: |
    Refused rather than evaluated to `False`, which is what an unrecognised key would
    otherwise mean. Silently false is the dangerous answer here: the row never fires, and it
    reads to everybody — the author, the reviewer, the model driving the CLI — as a row that
    could. That is A122's failure mode arriving through a typo instead of through the format.

    A rule table is data a domain expert writes and a curator approves. The whole reason
    every part of it is validated at load is that the alternative is a rule that looks
    correct in review and does nothing in production, and nothing downstream can tell the
    difference between a rule that did not fire and a rule that was never written.

    Spec §4.5.

MD0312:
  emitted_by: resolver
  concern: routing
  says: "a scalar comparison is applied to a per-sample measurement"
  fires_on: [build, upgrade, profile]
  refuses: true
  fix: |
    Reduce the cohort to one fact, then test that fact:

        derives:
          - fact: cohort_max_read_length
            kind: integer
            aggregate: {measurement: read_length, over: cohort, using: max}
            because: >-
              the index is built once per run, so it must suit the longest read in it

        decisions:
          - decides: {effect: implementation, of: alignment}
            rows:
              - when: {cohort_max_read_length: ">= 70"}
                then: nf-core/star/align@2.7.11b
  explanation: |
    `read_length` is declared `per_sample`, so a profile may carry `[150, 100, 150]` — one
    value per sample — and `[150, 100, 150] >= 70` has no defined meaning. Python's answer is
    `TypeError`, raised from inside the resolver, naming neither the rule nor the fact.

    **This is §12's cohort-versus-sample question, and the point is that the file must
    answer it.** A rule reading a cohort has to say what it meant by it: the longest read,
    the shortest, the mean. Choosing one on the author's behalf would be a decision made in
    code about biology, which is precisely the boundary the tier-3 rule tables exist to keep
    on the data side — and it would be invisible, because the pipeline would build.

    A per-sample measurement written as a *scalar* is not affected: that is the claim that
    the cohort is uniform, and the comparison is well defined.

    Spec §3.2; added with Plan 1.15's per-sample representation.

MD0306:
  emitted_by: resolver
  concern: routing
  says: "a decision names a role nothing fills, or a row names a contract that does not fill it"
  fires_on: [build, upgrade, profile]
  refuses: true
  fix: |
    Name a role some contract in the stack fills, and rows that fill it:

        decisions:
          - decides: {effect: implementation, of: alignment}
            rows:
              - {when: {read_length: ">= 70"}, then: nf-core/star/align@1.11.0}

    A contract claims a role in its own file — `roles: [alignment]` — so a lab adding an
    aligner declares it there rather than editing the rule.
  explanation: |
    **This is R20, the shape a lab writing overlay rules meets first**, and the improvement
    is in what the author is told rather than in what is refused. The old format could only
    say *"nf-core/salmon@1.10.0 is not in the registry"*, which is true and unhelpful, and it
    gave the identical message whether the contract was absent or merely doing a different
    job. A role names the *work*: "nothing in this stack does alignment" is a sentence about
    a pipeline, and "salmon fills quantification, not alignment" tells the author what they
    got wrong.

    Refused rather than skipped, because a decision that can never apply is indistinguishable
    at resolution from one nobody wrote — which is the same argument as `MD0304` and the same
    argument as the whole of spec §5.

    Audit A119, A123.

MD0307:
  emitted_by: resolver
  concern: routing
  says: "a decision's effect and its `name` disagree, or a presence row is not present/absent"
  fires_on: [build, upgrade, profile]
  refuses: true
  fix: |
    A `param` effect names a parameter; the other two decide the role itself:

        - decides: {effect: param, of: alignment, name: seq_platform}
        - decides: {effect: implementation, of: alignment}
        - decides: {effect: presence, of: trimming}
          rows: [{when: {}, then: absent, cite: "…"}]
  explanation: |
    The decision key is `(effect, role[, name])`, so a `name` that should not be there
    changes the key silently — which is exactly what `MD0309` exists to prevent one level
    up. A target that validates loosely and keys precisely is the worst combination
    available: two authors write what looks like the same decision and get two keys.

    **A presence row says `present` or `absent` because it is a claim about the world.**
    The shipped format spelled "do not trim" as `producer_of: fastq.reads` with
    `then: null`, which reads as a null pointer rather than as a sentence, and which is
    also why it could collide with an unrelated decision about the same type.

    Spec §4.1.

MD0308:
  emitted_by: resolver
  concern: routing
  says: "a param decision sets a value some filler of the role does not declare"
  fires_on: [build, upgrade, profile]
  refuses: true
  fix: |
    Narrow the decision to the implementations that declare the parameter:

        - decides:
            effect: param
            of: alignment
            name: star_ignore_sjdbgtf
            when_implementation: [nf-core/star/align@1.11.0]

    Or decide a parameter every filler of the role declares.
  explanation: |
    `star_ignore_sjdbgtf` is STAR's alone. A rule setting it for the whole `alignment` role
    resolves a value that reaches nothing whenever HISAT2 wins — issue #10's deadness,
    arriving through the rule format rather than through a contract. The pipeline builds, the
    artifact records a tier-3 decision with a citation, and the flag never reaches a tool.

    **The check is stronger than the one it replaces.** The old question was "does any
    contract in the registry declare this parameter", which one filler answering yes was
    enough to satisfy. The question now is "does *every* contract that could fill this role
    declare it", and `when_implementation` is how an author says which ones the value is for.
    Saying it is the point: a reader of the rule can then see the value is conditional, where
    before they would have had to compare two contracts' parameter lists to find out.

    Audit A123.

MD0309:
  emitted_by: resolver
  concern: routing
  says: "two decisions in one file decide the same key"
  fires_on: [build, upgrade, profile]
  refuses: true
  fix: |
    Merge them into one block with both rows, or give them different targets. A reviewer
    should be able to read one block and see the entire effective decision.
  explanation: |
    **A119, reproduced first-hand on 2026-08-15.** Two decisions sharing a key do not both
    apply: `Policy.REPLACE` keeps one and drops the other, silently, at exit 0. Installing a
    laboratory's duplicate-handling overlay swapped HISAT2 for STAR on a 50bp goal, and both
    builds passed `gate lint` at exit 0.

    The old key was a type id, so a rule about duplicate handling and a rule about which
    aligner to use both had to key on `alignment.bam` — two unrelated decisions forced into
    one key by the format. Keying on `(effect, role[, name])` is what makes them different
    keys; this diagnostic is for the case that is still genuinely a collision.

    **Per file, and `stack()` catches the per-layer case with its own message.** The two are
    not redundant and neither can see the other's: a file is the unit an author is looking at
    when they write the second decision, and a layer is the unit `stack()` reasons about.
    Between *layers* a replacement is legal and is the whole of invariant 11.

MD0310:
  emitted_by: resolver
  concern: routing
  says: "a `when` clause names a premise nothing supplies, or compares one that cannot be ordered"
  fires_on: [build, upgrade, profile]
  refuses: true
  fix: |
    Name a declared measurement, a derived fact, or a goal fact:

        when: {read_length: ">= 70"}        # a declared measurement
        when: {cohort_max_read_length: 150} # a fact some `derives:` block supplies
        when: {required_states: absent}     # what the goal asked the output to carry

    An enum compares with equality, `in` or `not` — never with `>=`.
  explanation: |
    **`when` sees more than measurements now**, which is A120: the router already consulted
    the goal's `required_states` and a rule could not, so R11 — Salmon for transcript-level
    counts, featureCounts for gene-level — was unwritable. The premise set is one namespace
    over measurements, goal facts and derived facts, and this diagnostic names all three
    rather than only the one the old message knew about.

    **Checked after the whole stack is assembled, not while a file is parsed.** A decision
    may read a fact a derivation in another file supplies, so a per-file check would refuse a
    legitimate rule for the accident of which file `stack()` reached first. Same reason
    `roles.check` runs after the registry is built rather than inside a contract's parse.

    Audit A120, A121.

MD0313:
  emitted_by: resolver
  concern: routing
  says: "a row exits at tier 2 and cites nothing"
  fires_on: [build, upgrade, profile]
  refuses: true
  fix: |
    Give the row — or its block — a `cite:` naming the document:

        rows:
          - when: {}
            then: absent
            because: "amplicon libraries carry no adapter to remove"
            cite: "nf-core/rnaseq --skip_trimming"

    Or condition the row on a premise, if it is really testing the data — a row that tests
    one positively exits at tier 3 and this rule does not apply to it.
  explanation: |
    **A row's tier is read off its own text**, so a row testing no premise positively exits
    at tier 2 whatever the block around it looks like. `when: {}` is a catch-all and
    `when: {x: absent}` is a convention about what to assume in a gap; neither matched
    measured data, which is tier 3's definition.

    Tier 2 is *"a documented default exists"*, so what it produces is **value plus the
    document**. A `because` alone states the value and asserts that a document exists
    somewhere, which is precisely the shape of the two findings this rule generalises: A76,
    where a contract default's justification lived in a YAML comment the loader dropped, and
    A128, the same thing one field over. Both were fixed individually; this states the rule
    once so the third instance is refused rather than found.

    **This is not `MD0301`.** That one refuses a row justifying *nothing at all* — no
    `because` and no `cite`, at any tier. This one refuses a tier-2 row that has a sentence
    and no source. A row can satisfy `MD0301` and fail this.

    Spec §4.4; audit A76, A128, A113.

MD0311:
  emitted_by: resolver
  concern: routing
  says: "a decision's rows do not cover the domain of the premise they test"
  fires_on: [build, upgrade, profile]
  refuses: true
  fix: |
    Cover the rest of the domain. Two complementary comparisons at one boundary are
    exhaustive with no bound declared anywhere:

        rows:
          - {when: {read_length: ">= 70"}, then: nf-core/star/align@1.11.0,  cite: "…"}
          - {when: {read_length: "< 70"},  then: nf-core/hisat2/align@2.2.2, cite: "…"}

    For an enum, cover its declared values — or, where it is `extensible: true`, add a
    catch-all `when: {}` row with a `cite:`, because an overlay may add a value later.
  explanation: |
    **A rule with a hole does not fail. It demotes.** The premise falls through every row,
    nothing matches, and the decision exits at tier 4 with *"no rule matched"* beside it. A
    reviewer reads that as an ambiguity the registry has not got to yet, when what it means
    is that somebody wrote three branches of a four-branch table and nothing said so. Audit
    A124.

    **The obvious fix would have been worse than the defect.** Demanding a catch-all on every
    decision demotes its last branch from tier 3 to tier 2 — a catch-all tests no premise
    positively, so it earns tier 2 by `MD0313`'s own rule — and takes that branch's premise
    and citation with it. The shipped aligner rule would have lost Kim et al. 2019 to satisfy
    a completeness check. So completeness is checked against the **declared domain** instead:
    `>= 70` and `< 70` are complementary by construction, and `Measurement` already declares
    `kind`, `values`, `minimum`, `maximum` and `extensible`. No new types were needed.

    **Overlaps are legal and are not gaps.** `>= 50` beside `< 70` covers the line twice, and
    first-match-wins already settles which row applies. Refusing that would be enforcing a
    different property under completeness' name.

    **Rows testing more than one premise are not checked**, deliberately. Completeness over a
    product of domains is a much larger claim, and a check that half-computed it would refuse
    legitimate tables — worse than not checking, because the author cannot argue with a
    refusal nobody can explain.

    Checked after the whole stack is assembled: `add_values` lets an overlay extend an enum,
    so a table exhaustive against the base layer alone is not exhaustive against the stack it
    will run under.

    Spec §5, §7.1.
