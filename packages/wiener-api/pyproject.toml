[project]
name = "wiener-api"
version = "0.1.0"
requires-python = ">=3.12"
description = "Run management: launch, watch, remember"
dependencies = [
    "comeni-core>=0.1.0", "wiener-core>=0.1.0",
    "fastapi>=0.115", "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0", "alembic>=1.13", "psycopg[binary]>=3.2",
    "redis>=5.0", "arq>=0.26", "pydantic-settings>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wiener_api"]

[tool.uv.sources]
comeni-core = { workspace = true }
wiener-core = { workspace = true }
