[project]
name = "mendel-forge"
version = "0.1.0"
requires-python = ">=3.12"
description = "Scaffolding and verification for the Mendel registry"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{name = "Rafael Correia"}]
keywords = ["bioinformatics", "nextflow", "workflow", "reproducibility", "pipeline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]

# Lower bounds, no caps — see mendel-resolver's manifest and docs/guides/releasing.md.
dependencies = [
  "comeni-core>=0.1.0",
  "mendel-resolver>=0.1.0",
  "mendel-compiler>=0.1.0",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pyyaml>=6.0",
]
# **`httpx` is a real dependency and not an extra, unlike `comeni-ai` below.** Reading an
# upstream catalogue *is* what a source adapter does, so a forge that cannot reach the network
# has no source path at all — there is no useful "offline forge" for this to be optional for.
# It is also small, where litellm's stack is 152MB, so the argument that made the model path an
# extra does not transfer.
#
# This package is classified impure in `tests/guards/test_purity.py`, so the arrow it adds
# points mendel-forge -> the network and never touches the pure four. `comeni-vendor` already
# holds the same position for fetching a module, and it is the reason that verb is not
# `mendel vendor`.

[project.optional-dependencies]
model = ["comeni-ai>=0.1.0"]
# **`forge fill --model` is opt-in, and this is where that stops being a convention.** The
# served API cannot reach the model path — invariant 3 confines runtime AI to three points and
# none is built — so an image that syncs `--package mendel-api` skips litellm and its stack,
# measured at 152MB of a 285MB virtualenv. The root project still depends on `comeni-ai`, so
# `uv sync` for development and CI installs it and nothing changes for them.


[project.urls]
Homepage = "https://github.com/comeni-project/Comeni-Labs"
Documentation = "https://github.com/comeni-project/Comeni-Labs/tree/main/docs"
Repository = "https://github.com/comeni-project/Comeni-Labs"
Issues = "https://github.com/comeni-project/Comeni-Labs/issues"
Changelog = "https://github.com/comeni-project/Comeni-Labs/blob/main/CHANGELOG.md"

[project.scripts]
forge = "mendel_forge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mendel_forge"]
