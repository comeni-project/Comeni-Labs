[project]
name = "mendel-api"
version = "0.1.0"
requires-python = ">=3.12"
description = "HTTP surface over the Mendel engine and the forge"
dependencies = [
    "comeni-core>=0.1.0",
    "comeni-ai>=0.1.0",
    "mendel-resolver>=0.1.0",
    "mendel-compiler>=0.1.0",
    "mendel-forge>=0.1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "arq>=0.26",
    "pydantic-settings>=2.4",
    "cryptography>=42",
    # An uploaded sample is inspected in a child process running `comeni_inspect.run`, and its
    # body is streamed through python-multipart so only each file's head is ever held (#134).
    "comeni-inspect>=0.1.0",
    "python-multipart>=0.0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mendel_api"]

[tool.uv.sources]
comeni-core = { workspace = true }
comeni-inspect = { workspace = true }
comeni-ai = { workspace = true }
mendel-resolver = { workspace = true }
mendel-compiler = { workspace = true }
mendel-forge = { workspace = true }
