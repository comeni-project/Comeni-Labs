[project]
name = "mendel-api"
version = "0.1.0"
requires-python = ">=3.12"
description = "HTTP surface over the Mendel engine and the forge"
dependencies = [
    "comeni-core",
    "mendel-resolver",
    "mendel-compiler",
    "mendel-forge",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "arq>=0.26",
    "pydantic-settings>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mendel_api"]

[tool.uv.sources]
comeni-core = { workspace = true }
mendel-resolver = { workspace = true }
mendel-compiler = { workspace = true }
mendel-forge = { workspace = true }
