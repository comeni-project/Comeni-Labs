id: nf-core/hisat2/align@2.2.2
nf_process: HISAT2_ALIGN
nf_include: modules/nf-core/hisat2/align/main
consumes:
  - {name: reads, type_id: fastq.reads, state_required: [trimmed]}
  - {name: index, type_id: genome.index.hisat2, state_required: []}
produces: [{name: bam, type_id: alignment.bam, state: []}]
params:
  - {name: seq_platform, tier_hint: 4}
priority: 0
# tuple(meta, reads) | tuple(meta2, index) | tuple(meta3, splicesites) | val save_unaligned
nf_inputs:
  - {ports: [reads]}
  - {ports: [index]}
  - {empty: 2, because: "splicesites are optional; HISAT2_EXTRACTSPLICESITES is not vendored"}
  - {literal: false}
container: community.wave.seqera.io/library/hisat2_samtools:6ca0ef72b662d5c8
provenance: {source: nf-core-meta-yml, drafted_by: hand, approved_by: rafael, approved_at: "2026-08-03"}
