# Alembic writes these from its own templates. Linting generated files means either
# hand-editing every migration to satisfy a style it did not choose, or a noqa storm.
exclude = ["packages/mendel-api/migrations", "packages/wiener-api/migrations"]

line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[lint.per-file-ignores]
# The mockup builder is HTML: its long lines are style attributes and SVG path data inside
# string literals, where a wrap puts the break somewhere the reader has to undo, and its
# markup is `%`-templated because a template is filled positionally after it is written.
# Relaxed only here, and only for the two rules that are about writing HTML in Python —
# E, F, I, B, SIM and the rest of UP still apply. Nothing imports these files (A196): they
# are a design tool whose output is nine artboards, and the artboards are the artifact.
"docs/design/*-mockups/build.py" = ["E501", "UP031"]
# The runs board is drawn by the same tool for the same reason — it borrows `build.py`'s
# chrome rather than restating it, so it inherits its shape and therefore its two exemptions.
"docs/design/runs-board/board.py" = ["E501", "UP031"]
# `.design/` is the same class again: two generators whose output is twenty-four artboards,
# and whose long lines are style attributes, SVG path data and `{{ }}` template holes inside
# string literals. **E501 only** — deliberately not a directory exclude, because F811 caught
# seven superseded functions left behind by an append-and-override edit, and a blanket exclude
# would have shipped all seven. Nothing imports these files; `python runs_boards.py` and
# `python build_boards.py` regenerate the `.dc.html` beside them, byte for byte.
".design/*.py" = ["E501"]
