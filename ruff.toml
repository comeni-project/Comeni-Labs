# Alembic writes these from its own templates. Linting generated files means either
# hand-editing every migration to satisfy a style it did not choose, or a noqa storm.
exclude = ["packages/mendel-api/migrations"]

line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[lint.per-file-ignores]
# The mockup builder is HTML: its long lines are style attributes and SVG path data inside
# string literals, where a wrap puts the break somewhere the reader has to undo. Only the
# length rule is relaxed, and only here — E, F, I, UP, B and SIM still apply to the code.
"docs/design/*-mockups/build.py" = ["E501"]
