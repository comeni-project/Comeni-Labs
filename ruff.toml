# Python lint and formatting settings. make lint checks code; make fmt rewrites formatting.
# Sections: discovery and Python version; enabled rules; design-generator exceptions.

# Skip Alembic migration directories during discovery to retain their template formatting.
# This also skips migration env.py files; explicitly named files can still be linted.
exclude = ["packages/mendel-api/migrations", "packages/wiener-api/migrations"]

line-length = 100
target-version = "py312"

[lint]
# Errors, undefined/unused names, import order, Python upgrades, bug patterns, simplifications.
select = ["E", "F", "I", "UP", "B", "SIM"]

[lint.per-file-ignores]
# HTML/SVG generators retain long literals and positional percent-format templates.
# Other selected lint rules still apply.
".design/*-mockups/build.py" = ["E501", "UP031"]
".design/runs-board/board.py" = ["E501", "UP031"]

# Allow long HTML/SVG literals across .design/, including nested Python files.
# Keep correctness checks such as duplicate definitions enabled.
".design/*.py" = ["E501"]
# Explicit canvas exception; the broader pattern above already covers this file.
".design/living-pipeline/build_living.py" = ["E501"]
