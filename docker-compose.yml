# The stack. `docker-compose.prod.yml` is an OVERLAY over this one that removes the unsafe
# parts — a live code mount, an auto-reloader, a database port on the host — and nothing else.
# Dev can do everything prod can; that is the whole shape of the split.
#
# The registry is NOT seeded here and never will be: declared data is files by decision
# (issue #43), so there is nothing to migrate for it. What IS mounted is a writable CLONE of
# it, because accepting a drift is a commit and a submodule's `.git` is a pointer that
# resolves to nothing inside a container. `make dev` makes the clone.
services:
  postgres:
    image: postgres:17-alpine
    container_name: ${DB_CONTAINER_NAME:-mendel-db}
    environment:
      POSTGRES_USER: mendel
      POSTGRES_PASSWORD: mendel
      POSTGRES_DB: mendel
    ports: ["${DB_HOST_PORT:-5432}:5432"]
    volumes: ["mendel-pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mendel"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: ${REDIS_CONTAINER_NAME:-mendel-redis}
    ports: ["${REDIS_HOST_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  api:
    build: .
    container_name: ${API_CONTAINER_NAME:-mendel-api}
    # **Runs as the host user, not root.** Two things break otherwise, and both were found by
    # running it: git refuses a bind-mounted repository owned by a different uid ("detected
    # dubious ownership"), so accepting a drift returns MF0107 against a perfectly good clone;
    # and every draft written into `./workspace` lands root-owned and undeletable by whoever
    # started the stack. CLAUDE.md records the same trap for Nextflow's work directories.
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      MENDEL_DATABASE_URL: postgresql+psycopg://mendel:mendel@postgres:5432/mendel
      MENDEL_REDIS_URL: redis://redis:6379
      MENDEL_REGISTRY_ROOT: /app/registry
      MENDEL_EXAMPLE_GOAL: /app/examples/rnaseq-goal.yml
      MENDEL_WORKSPACE_ROOT: /app/workspace
      MENDEL_DRAFT_ROOT: /app/drafts
    ports: ["${API_HOST_PORT:-8000}:8000"]
    volumes:
      - ./packages:/app/packages
      # **A CLONE, not the submodule.** A submodule's `.git` is a pointer at a host path that
      # resolves to nothing in here, so accepting a drift would refuse with MF0107 — and dev
      # must be able to do what prod can. `make dev` creates it.
      - ./.run/registry:/app/registry
      # What the builder opens on. Read-only: a committed example, not state.
      - ./examples:/app/examples:ro
      - ./workspace:/app/workspace
      # **Shared, because two containers meet here.** `keep` (api) writes the artifact and
      # the gate job (worker) runs Nextflow in it. This was set as an env var on both
      # services with nothing backing it until 2026-08-23, so the file lived in one
      # container's ephemeral layer and the other could not see it.
      - ./.run/drafts:/app/drafts
    # **`sh -c`, never `sh -lc`.** A LOGIN shell re-reads `/etc/profile`, which resets `PATH`
    # and drops `/app/.venv/bin` — so `alembic: not found` and the container exits. Measured:
    # `sh -lc` gives `/usr/local/sbin:...` with no venv; `sh -c` keeps it. Cladewright uses
    # `-lc` and gets away with it because its python is the system one.
    #
    # One line on purpose: a folded (>) block keeps a newline before the over-indented flag
    # and `--reload` is silently dropped.
    command: sh -c "cd packages/mendel-api && alembic upgrade head && cd /app && exec uvicorn mendel_api.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build: .
    container_name: ${WORKER_CONTAINER_NAME:-mendel-worker}
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      MENDEL_DATABASE_URL: postgresql+psycopg://mendel:mendel@postgres:5432/mendel
      MENDEL_REDIS_URL: redis://redis:6379
      MENDEL_REGISTRY_ROOT: /app/registry
      MENDEL_EXAMPLE_GOAL: /app/examples/rnaseq-goal.yml
      MENDEL_WORKSPACE_ROOT: /app/workspace
      MENDEL_DRAFT_ROOT: /app/drafts
    volumes:
      - ./packages:/app/packages
      - ./.run/registry:/app/registry
      # What the builder opens on. Read-only: a committed example, not state.
      - ./examples:/app/examples:ro
      - ./workspace:/app/workspace
      # **Shared, because two containers meet here.** `keep` (api) writes the artifact and
      # the gate job (worker) runs Nextflow in it. This was set as an env var on both
      # services with nothing backing it until 2026-08-23, so the file lived in one
      # container's ephemeral layer and the other could not see it.
      - ./.run/drafts:/app/drafts
    command: arq mendel_api.worker.WorkerSettings

  # **In the base, not only in prod**, so dev serves the same path prod does — nginx in front,
  # the SPA built, `/api` proxied. Vite on the host is ADDITIONAL, for HMR: dev has strictly
  # more than prod, never less.
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ${WEB_CONTAINER_NAME:-mendel-web}
    depends_on: [api]
    # **nginx resolves its upstream once, at startup, and dies if it cannot.** `depends_on`
    # waits for the container to start rather than for it to serve, so a slow migration or a
    # crashed api takes nginx down with it and it does not come back. Restarting is the fix
    # compose gives for exactly this.
    restart: unless-stopped
    ports: ["${WEB_HOST_PORT:-80}:80"]

  wiener-postgres:
    # **Wiener's own database, not a schema in Mendel's.** `execution-boundary.md` §8 names the
    # failure mode as run state entangling with the deterministic half, and a shared server is
    # where that starts: one connection string, one migration chain, one `Base.metadata`, and
    # the first join across the line is easy to write and hard to notice.
    image: postgres:17-alpine
    container_name: ${WIENER_DB_CONTAINER_NAME:-wiener-db}
    environment:
      POSTGRES_USER: wiener
      POSTGRES_PASSWORD: wiener
      POSTGRES_DB: wiener
    ports: ["${WIENER_DB_HOST_PORT:-5433}:5432"]
    volumes: ["wiener-pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiener"]
      interval: 2s
      timeout: 2s
      retries: 30

  wiener-ingest:
    # **Where the head process posts.** Its own service, and its port is never published —
    # reachable on the compose network and from nowhere else.
    #
    # Not in the worker beside Nextflow, which was the other candidate. Two facts decided it,
    # both checked on 2026-08-24 rather than assumed:
    #
    # - **The head process moves.** `kuberun` is deprecated and the production Kubernetes
    #   pattern is a pod that runs Nextflow, so in W5 the head is not a child of this worker
    #   and `127.0.0.1` reaches nothing. Topology that only works while the head is a child is
    #   topology that gets rewritten under pressure.
    # - **`nf-weblog` does not retry and does not flush on exit** (nextflow-io/nextflow#1010),
    #   so any moment this is unavailable loses events *permanently*. It must therefore have
    #   the fewest reasons to restart of anything here — which is the exact opposite of the
    #   container that runs pipeline code and is redeployed whenever that changes.
    #
    # §13.1's guarantee is unchanged in substance and its wording had to move: *not on the
    # public app*, and *a per-run secret*. Loopback was one implementation of "the internet
    # cannot reach this"; an unpublished port is another.
    build: .
    container_name: ${WIENER_INGEST_CONTAINER_NAME:-wiener-ingest}
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    depends_on:
      wiener-postgres: {condition: service_healthy}
    environment:
      WIENER_DATABASE_URL: postgresql+psycopg://wiener:wiener@wiener-postgres:5432/wiener
      WIENER_REDIS_URL: redis://redis:6379/1
      WIENER_ARTIFACT_ROOT: ${PWD}/.run/wiener/artifacts
    volumes: ["${PWD}/.run/wiener:${PWD}/.run/wiener"]
    command: uvicorn wiener_api.main:create_ingest_app --factory --host 0.0.0.0 --port 8099

  wiener-worker:
    # Where a run is actually launched. It spawns Nextflow, so it is the container that needs
    # Nextflow and Java on its PATH — and the one that gets redeployed most often.
    build: .
    container_name: ${WIENER_WORKER_CONTAINER_NAME:-wiener-worker}
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    depends_on:
      wiener-postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      WIENER_DATABASE_URL: postgresql+psycopg://wiener:wiener@wiener-postgres:5432/wiener
      WIENER_REDIS_URL: redis://redis:6379/1
      WIENER_ARTIFACT_ROOT: ${PWD}/.run/wiener/artifacts
      WIENER_WORK_ROOT: ${PWD}/.run/wiener/work
      WIENER_INGEST_BASE_URL: http://wiener-ingest:8099
      WIENER_CONTAINER_PROFILE: docker
    volumes:
      # **The Docker socket, and what that means, said plainly.**
      #
      # Nextflow launches a container per task, and this container is where Nextflow runs — so
      # it needs a container runtime. Mounting the host's socket gives whatever runs here the
      # ability to start containers on the host, which is root-equivalent: a container can
      # mount `/`. **Whoever can submit a run can therefore reach the host**, and the thing
      # standing in front of that is `WIENER_API_TOKEN`.
      #
      # That is the posture every CI runner takes — Jenkins agents, GitLab runners — and the
      # rule is the same: *the runner is as trusted as what it runs*. Here that is the
      # laboratory's own gated pipelines from a registry it curates. `docs/design/wiener.md`
      # §12.1 records it as a cost rather than leaving it to be discovered.
      #
      # **It goes away in W5.** With `-profile k8s` or `awsbatch` Nextflow submits jobs to a
      # scheduler and starts no local containers, so this line is a `local`-executor concession
      # and not an architectural one.
      #
      # The alternative considered and rejected for the MVP: Apptainer in this image, which is
      # rootless and needs unprivileged user namespaces, `/dev/fuse` and a seccomp exception —
      # it works here and not on an Ubuntu 24.04 host, which is the opposite of "works
      # anywhere".
      - /var/run/docker.sock:/var/run/docker.sock
      # **Mounted at the SAME absolute path inside and out**, which is not tidiness. Nextflow
      # asks the host's daemon to bind-mount a task's work directory, and the daemon resolves
      # that path against the HOST filesystem — so a container path of `/var/wiener/work` would
      # mount a directory the host does not have, and every task would see an empty workdir.
      - ${PWD}/.run/wiener:${PWD}/.run/wiener
    # The socket is owned by root:docker; this container runs as the host user, which needs to
    # be in that group to open it.
    group_add: ["${DOCKER_GID_SOCK:-957}"]
    command: arq wiener_api.worker.WorkerSettings

  wiener-api:
    build: .
    container_name: ${WIENER_API_CONTAINER_NAME:-wiener-api}
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    depends_on:
      wiener-postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      WIENER_DATABASE_URL: postgresql+psycopg://wiener:wiener@wiener-postgres:5432/wiener
      WIENER_REDIS_URL: redis://redis:6379/1
      WIENER_ARTIFACT_ROOT: ${PWD}/.run/wiener/artifacts
      WIENER_WORK_ROOT: ${PWD}/.run/wiener/work
      # **Unset by default, and the API says so at startup.** Right for a laptop and wrong for
      # anything reachable — §12.1. `WIENER_API_TOKEN=$(openssl rand -hex 24)` in a `.env`.
      WIENER_API_TOKEN: ${WIENER_API_TOKEN:-}
    volumes: ["${PWD}/.run/wiener:${PWD}/.run/wiener"]
    # **No published port.** nginx is the way in — one origin, split by path, the same split
    # `vite.config.ts` already makes in development, which is why that file proxies Wiener at
    # nginx rather than at a port this service does not open.
    #
    # **It migrates its own database, like `api` does.** This ran `alembic upgrade head` in
    # `docker-compose.prod.yml` and nowhere else, so `make prod` came up migrated and `make dev`
    # came up with no `run` table — the stack looked green and the first request to `/api/runs`
    # was a 500 naming a relation that does not exist. A migration belongs where the service is
    # defined; the overlay is for what prod removes, not for what dev was missing.
    command: sh -c "cd packages/wiener-api && alembic upgrade head && cd /app && exec uvicorn wiener_api.main:create_app --factory --host 0.0.0.0 --port 8001"

  # ---- telemetry: opt-in, `make telemetry` or `--profile telemetry` -------------------
  #
  # **Not in the default stack**, because `make dev` should not grow a ClickHouse for people
  # who are working on the forge. **Not a separate file either**, because two compose files
  # drift — which is the argument `docker-compose.prod.yml`'s own header makes about overlays.
  #
  # **ClickHouse and Grafana rather than SigNoz** (2026-08-24). SigNoz is what §8 named and it
  # deprecated bundled Compose in v0.130.0, installing through a CLI that renders its own
  # stack; vendoring that manifest means running an unmaintained copy of somebody else's
  # deployment. These are first-party images, the store is the same ClickHouse either way, and
  # the boards are JSON in `ops/boards/` rather than something clicked into a vendor's UI.
  clickhouse:
    image: clickhouse/clickhouse-server:25.3-alpine
    container_name: ${CLICKHOUSE_CONTAINER_NAME:-wiener-clickhouse}
    profiles: [telemetry]
    environment:
      CLICKHOUSE_DB: otel
      CLICKHOUSE_USER: otel
      CLICKHOUSE_PASSWORD: otel
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes: ["wiener-clickhouse:/var/lib/clickhouse"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.121.0
    container_name: ${OTEL_CONTAINER_NAME:-wiener-otel}
    profiles: [telemetry]
    command: ["--config=/etc/otel/collector.yaml"]
    volumes: ["./ops/otel/collector.yaml:/etc/otel/collector.yaml:ro"]
    depends_on:
      clickhouse: {condition: service_healthy}
    ports: ["${OTLP_HOST_PORT:-4317}:4317"]

  grafana:
    image: grafana/grafana:11.6.0
    container_name: ${GRAFANA_CONTAINER_NAME:-wiener-grafana}
    profiles: [telemetry]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    volumes:
      # **The whole provisioning tree, not one directory of it.** Grafana reads
      # `provisioning/datasources/` and `provisioning/dashboards/` as separate providers, and
      # mounting `ops/grafana` onto the datasources directory alone meant the dashboard
      # provider was never seen: "starting to provision dashboards / finished" with nothing
      # between, and an empty search.
      - ./ops/grafana:/etc/grafana/provisioning:ro
      - ./ops/boards:/etc/grafana/boards:ro
    depends_on:
      clickhouse: {condition: service_healthy}
    ports: ["${GRAFANA_HOST_PORT:-3001}:3000"]

volumes:
  mendel-pg:
  wiener-pg:
  wiener-clickhouse:
