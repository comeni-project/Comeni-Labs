# Comeni Labs: APIs and workers for building and running pipelines, with databases,
# a browser app, and a documentation server. Start the development stack with `make dev`.
#
# Sections:
#   1. Shared infrastructure: PostgreSQL and Redis
#   2. Mendel: pipeline-building API and workers
#   3. Local AI: optional Ollama model server (`--profile ai`)
#   4. Web and documentation: browser app and wiki


#   5. Wiener: event receiver, worker, and API
#   6. Telemetry: optional collector, storage, and dashboards (`--profile telemetry`)
#   7. Named volumes: persistent databases, telemetry, and model files
#
# The Python services share the root Dockerfile; the web service uses frontend/Dockerfile.
# Use docker-compose.prod.yml alongside this file for the production overrides.
#
# `make dev` prepares a writable registry clone at .run/registry. Mendel services mount
# it at /app/registry so they can read declarations and commit accepted registry changes.
x-python-build: &python-build
  context: .
  args:
    RUNTIME_UID: ${DOCKER_UID:-1000}
    RUNTIME_GID: ${DOCKER_GID:-1000}

services:
  # -----------------------------------------------------------------------------
  # 1. Shared infrastructure
  # -----------------------------------------------------------------------------
  # One server; separate database owners and migration histories for each subsystem.
  # A new volume preserves the two legacy volumes for verified migration and rollback.
  postgres:
    image: postgres:17-alpine
    container_name: ${DB_CONTAINER_NAME:-comeni-db}
    restart: unless-stopped
    environment:
      POSTGRES_USER: comeni_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-comeni-local-admin}
      POSTGRES_DB: postgres
      MENDEL_DB_PASSWORD: ${MENDEL_DB_PASSWORD:-mendel}
      WIENER_DB_PASSWORD: ${WIENER_DB_PASSWORD:-wiener}
    ports: ["127.0.0.1:${DB_HOST_PORT:-5432}:5432"]
    volumes:
      - comeni-pg:/var/lib/postgresql/data
      - ./ops/postgres/validate-passwords.sh:/docker-entrypoint-initdb.d/00-validate-passwords.sh:ro
      - ./ops/postgres/init.sql:/docker-entrypoint-initdb.d/10-applications.sql:ro
      - ./ops/postgres/healthcheck.sh:/usr/local/bin/comeni-postgres-health:ro
    healthcheck:
      # The entrypoint's temporary init server accepts sockets only, so test TCP readiness.
      test: ["CMD", "sh", "/usr/local/bin/comeni-postgres-health"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Queue background jobs for Mendel and Wiener, and hold Wiener's live event streams.
  # Mendel uses Redis database 0; Wiener uses database 1.
  redis:
    image: redis:7-alpine
    container_name: ${REDIS_CONTAINER_NAME:-mendel-redis}
    restart: unless-stopped  # see postgres, same thing
    ports: ["127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  # -----------------------------------------------------------------------------
  # 2. Mendel
  # -----------------------------------------------------------------------------
  # Serve Mendel's API for pipeline building, registry browsing, and tool adaptation.
  api:
    build: *python-build
    container_name: ${API_CONTAINER_NAME:-mendel-api}
    restart: unless-stopped
    # Use the host UID/GID to keep mounted files writable and Git ownership consistent.
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      MENDEL_DATABASE_URL: postgresql+psycopg://mendel:${MENDEL_DB_PASSWORD:-mendel}@postgres:5432/mendel
      MENDEL_REDIS_URL: redis://redis:6379
      MENDEL_REGISTRY_ROOT: /app/registry
      MENDEL_EXAMPLE_GOAL: /app/examples/rnaseq-goal.yml
      MENDEL_WORKSPACE_ROOT: /app/workspace
      MENDEL_DRAFT_ROOT: /app/drafts
      # Share model settings with the AI worker for configuration and health reporting.
      COMENI_AI_MODEL: ${COMENI_AI_MODEL:-}
      COMENI_AI_BASE_URL: ${COMENI_AI_BASE_URL:-}
      COMENI_AI_API_KEY: ${COMENI_AI_API_KEY:-}
      COMENI_AI_MODEL_WANT: ${COMENI_AI_MODEL_WANT:-}
      COMENI_AI_MODEL_TALK: ${COMENI_AI_MODEL_TALK:-}
      COMENI_AI_MODEL_TIER4: ${COMENI_AI_MODEL_TIER4:-}
      COMENI_AI_MODEL_READBACK: ${COMENI_AI_MODEL_READBACK:-}
      COMENI_AI_MODEL_FORGE: ${COMENI_AI_MODEL_FORGE:-}
      # Decrypt model credentials saved through Settings.
      COMENI_SETTINGS_KEY: ${COMENI_SETTINGS_KEY:-}
      COMENI_AI_TIMEOUT_SECONDS: ${COMENI_AI_TIMEOUT_SECONDS:-}
      COMENI_AI_TEMPERATURE: ${COMENI_AI_TEMPERATURE:-}
      COMENI_AI_MAX_CONCURRENT_JOBS: ${COMENI_AI_MAX_CONCURRENT_JOBS:-}
      # Authenticate GitHub catalogue requests to raise the upstream rate limit.
      COMENI_FORGE_GITHUB_TOKEN: ${COMENI_FORGE_GITHUB_TOKEN:-}
      COMENI_FORGE_DOCKERHUB_USER: ${COMENI_FORGE_DOCKERHUB_USER:-}
      COMENI_FORGE_DOCKERHUB_TOKEN: ${COMENI_FORGE_DOCKERHUB_TOKEN:-}
    ports: ["127.0.0.1:${API_HOST_PORT:-8000}:8000"]
    volumes:
      # Mount local code for development.
      - ./packages:/app/packages
      # Writable registry clone prepared by make dev for accepted tool updates.
      - ./.run/registry:/app/registry
      - ./examples:/app/examples:ro
      - ./workspace:/app/workspace
      # Share saved pipelines with mendel-worker for gates.
      - ./.run/drafts:/app/drafts
    # Migrate the database before serving; exec forwards shutdown signals to Uvicorn.
    # Use sh -c to preserve the virtualenv PATH, and keep command flags on one line.
    command: sh -c "cd packages/mendel-api && alembic upgrade head && cd /app && exec uvicorn mendel_api.main:app --host 0.0.0.0 --port 8000 --reload"

  # Run Mendel's background jobs: gates, source checks, and tool adaptation tasks.
  mendel-worker:
    build: *python-build
    container_name: ${WORKER_CONTAINER_NAME:-mendel-worker}
    # Restart if a lost Redis connection causes the worker to exit.
    restart: unless-stopped
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      MENDEL_DATABASE_URL: postgresql+psycopg://mendel:${MENDEL_DB_PASSWORD:-mendel}@postgres:5432/mendel
      MENDEL_REDIS_URL: redis://redis:6379
      MENDEL_REGISTRY_ROOT: /app/registry
      MENDEL_EXAMPLE_GOAL: /app/examples/rnaseq-goal.yml
      MENDEL_WORKSPACE_ROOT: /app/workspace
      MENDEL_DRAFT_ROOT: /app/drafts
      # Read model settings to decide whether to queue AI generation.
      COMENI_AI_MODEL: ${COMENI_AI_MODEL:-}
      COMENI_AI_BASE_URL: ${COMENI_AI_BASE_URL:-}
      COMENI_AI_API_KEY: ${COMENI_AI_API_KEY:-}
      COMENI_AI_MODEL_WANT: ${COMENI_AI_MODEL_WANT:-}
      COMENI_AI_MODEL_TALK: ${COMENI_AI_MODEL_TALK:-}
      COMENI_AI_MODEL_TIER4: ${COMENI_AI_MODEL_TIER4:-}
      COMENI_AI_MODEL_READBACK: ${COMENI_AI_MODEL_READBACK:-}
      COMENI_AI_MODEL_FORGE: ${COMENI_AI_MODEL_FORGE:-}
      # Decrypt model credentials saved through Settings.
      COMENI_SETTINGS_KEY: ${COMENI_SETTINGS_KEY:-}
      COMENI_AI_TIMEOUT_SECONDS: ${COMENI_AI_TIMEOUT_SECONDS:-}
      COMENI_AI_TEMPERATURE: ${COMENI_AI_TEMPERATURE:-}
      COMENI_AI_MAX_CONCURRENT_JOBS: ${COMENI_AI_MAX_CONCURRENT_JOBS:-}
      # Authenticate GitHub catalogue requests to raise the upstream rate limit.
      COMENI_FORGE_GITHUB_TOKEN: ${COMENI_FORGE_GITHUB_TOKEN:-}
      COMENI_FORGE_DOCKERHUB_USER: ${COMENI_FORGE_DOCKERHUB_USER:-}
      COMENI_FORGE_DOCKERHUB_TOKEN: ${COMENI_FORGE_DOCKERHUB_TOKEN:-}
    # Match the API paths so jobs can read its saved pipelines and tool adaptation files.
    volumes:
      - ./packages:/app/packages
      - ./.run/registry:/app/registry
      - ./examples:/app/examples:ro
      - ./workspace:/app/workspace
      - ./.run/drafts:/app/drafts
    command: arq mendel_api.worker.WorkerSettings

  # Run model calls for pipeline conversations, sample characterisation, and Forge.
  # A separate queue keeps long model calls from delaying other background jobs.
  ai-worker:
    build: *python-build
    container_name: ${AI_WORKER_CONTAINER_NAME:-mendel-ai-worker}
    restart: unless-stopped
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      MENDEL_DATABASE_URL: postgresql+psycopg://mendel:${MENDEL_DB_PASSWORD:-mendel}@postgres:5432/mendel
      MENDEL_REDIS_URL: redis://redis:6379
      MENDEL_REGISTRY_ROOT: /app/registry
      MENDEL_EXAMPLE_GOAL: /app/examples/rnaseq-goal.yml
      MENDEL_WORKSPACE_ROOT: /app/workspace
      MENDEL_DRAFT_ROOT: /app/drafts
      # Configure local or hosted models; Settings can also supply these values.
      COMENI_AI_MODEL: ${COMENI_AI_MODEL:-}
      COMENI_AI_BASE_URL: ${COMENI_AI_BASE_URL:-}
      COMENI_AI_API_KEY: ${COMENI_AI_API_KEY:-}
      COMENI_AI_MODEL_WANT: ${COMENI_AI_MODEL_WANT:-}
      COMENI_AI_MODEL_TALK: ${COMENI_AI_MODEL_TALK:-}
      COMENI_AI_MODEL_TIER4: ${COMENI_AI_MODEL_TIER4:-}
      COMENI_AI_MODEL_READBACK: ${COMENI_AI_MODEL_READBACK:-}
      COMENI_AI_MODEL_FORGE: ${COMENI_AI_MODEL_FORGE:-}
      # Decrypt model credentials saved through Settings.
      COMENI_SETTINGS_KEY: ${COMENI_SETTINGS_KEY:-}
      COMENI_AI_TIMEOUT_SECONDS: ${COMENI_AI_TIMEOUT_SECONDS:-}
      COMENI_AI_TEMPERATURE: ${COMENI_AI_TEMPERATURE:-}
      COMENI_AI_MAX_CONCURRENT_JOBS: ${COMENI_AI_MAX_CONCURRENT_JOBS:-}
      # Authenticate GitHub catalogue requests to raise the upstream rate limit.
      COMENI_FORGE_GITHUB_TOKEN: ${COMENI_FORGE_GITHUB_TOKEN:-}
      COMENI_FORGE_DOCKERHUB_USER: ${COMENI_FORGE_DOCKERHUB_USER:-}
      COMENI_FORGE_DOCKERHUB_TOKEN: ${COMENI_FORGE_DOCKERHUB_TOKEN:-}
    # Match the API paths so jobs can read its saved pipelines and tool adaptation files.
    volumes:
      - ./packages:/app/packages
      - ./.run/registry:/app/registry
      - ./examples:/app/examples:ro
      - ./workspace:/app/workspace
      - ./.run/drafts:/app/drafts
    command: arq mendel_api.ai_worker.AIWorkerSettings

  # -----------------------------------------------------------------------------
  # 3. Local AI (optional)
  # -----------------------------------------------------------------------------
  # Serve local AI models for Mendel through Ollama's HTTP API.
  ollama:
    # Use a ROCm image with docker-compose.ollama-rocm.yml for AMD GPU access.
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.34.4}
    container_name: ${OLLAMA_CONTAINER_NAME:-mendel-ollama}
    # Start with make ai-up or --profile ai when you need local models.
    profiles: [ai]
    # Keep downloaded models across restarts; OLLAMA_MODELS can reuse a host directory.
    volumes: ["${OLLAMA_MODELS:-ollama-models}:/root/.ollama"]
    environment:
      # Set the prompt context size to suit the workload and available memory.
      # Pass through only when set, so an unset value keeps Ollama's default.
      - OLLAMA_CONTEXT_LENGTH
      # Keep models loaded between requests to avoid reload delays.
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-1h}
      # Limit concurrent requests to control memory use.
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
    # Publish the model API on the host; other services use http://ollama:11434.
    ports: ["127.0.0.1:${OLLAMA_HOST_PORT:-11434}:11434"]
    healthcheck:
      # Check the server API; this does not verify model inference.
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  # -----------------------------------------------------------------------------
  # 4. Web and documentation
  # -----------------------------------------------------------------------------
  # Serve the browser app through nginx and route API requests to Mendel and Wiener.
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: ${WEB_CONTAINER_NAME:-mendel-web}
    depends_on: [api]
    # Restart nginx if it exits during startup while an API is unavailable.
    restart: unless-stopped
    ports: ["127.0.0.1:${WEB_HOST_PORT:-80}:80"]

  # Serve the project documentation with MkDocs and reload it when source files change.
  wiki:
    # Keep the documentation toolchain in its own image.
    image: squidfunk/mkdocs-material:9
    container_name: ${WIKI_CONTAINER_NAME:-mendel-wiki}
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    # Mount documentation read-only; make wiki-tools generates the tool catalogue.
    volumes:
      - ./mkdocs.yml:/docs/mkdocs.yml:ro
      - ./tools:/docs/tools:ro
      - ./docs:/docs/docs:ro
    ports: ["127.0.0.1:${WIKI_HOST_PORT:-8010}:8000"]
    # The image runs mkdocs; bind its server to the container network interface.
    command: ["serve", "--dev-addr=0.0.0.0:8000"]
    # Allow time for the initial documentation build before the server responds.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8000/"]
      interval: 5s
      timeout: 3s
      retries: 30

  # -----------------------------------------------------------------------------
  # 5. Wiener
  # -----------------------------------------------------------------------------
  # Receive Nextflow execution events for recording and live monitoring.
  # Keep event collection independent of worker restarts; use the internal service URL.
  wiener-ingest:
    build: *python-build
    container_name: ${WIENER_INGEST_CONTAINER_NAME:-wiener-ingest}
    restart: unless-stopped
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      WIENER_DATABASE_URL: postgresql+psycopg://wiener:${WIENER_DB_PASSWORD:-wiener}@postgres:5432/wiener
      WIENER_REDIS_URL: redis://redis:6379/1
      WIENER_ARTIFACT_ROOT: ${PWD}/.run/wiener/artifacts
    volumes: ["${PWD}/.run/wiener:${PWD}/.run/wiener"]
    # Listen on the Compose network without publishing a host port.
    command: uvicorn wiener_api.main:create_ingest_app --factory --host 0.0.0.0 --port 8099

  # Launch pipeline runs through Nextflow and manage background execution jobs.
  wiener-worker:
    build: *python-build
    container_name: ${WIENER_WORKER_CONTAINER_NAME:-wiener-worker}
    restart: unless-stopped
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      WIENER_DATABASE_URL: postgresql+psycopg://wiener:${WIENER_DB_PASSWORD:-wiener}@postgres:5432/wiener
      WIENER_REDIS_URL: redis://redis:6379/1
      WIENER_ARTIFACT_ROOT: ${PWD}/.run/wiener/artifacts
      WIENER_WORK_ROOT: ${PWD}/.run/wiener/work
      WIENER_INGEST_BASE_URL: http://wiener-ingest:8099
      WIENER_CONTAINER_PROFILE: docker
      WIENER_API_TOKEN: ${WIENER_API_TOKEN:-}
    volumes:
      # Let Nextflow launch task containers through the host Docker daemon.
      # Socket access grants host-level control; run trusted pipelines.
      - /var/run/docker.sock:/var/run/docker.sock
      # Keep host and container paths identical: the host daemon mounts task directories.
      - ${PWD}/.run/wiener:${PWD}/.run/wiener
    # Use the host Docker socket group so the worker can open it.
    group_add: ["${DOCKER_GID_SOCK:-957}"]
    command: arq wiener_api.worker.WorkerSettings

  # Serve run submission, monitoring, artifact uploads, and execution settings.
  wiener-api:
    build: *python-build
    container_name: ${WIENER_API_CONTAINER_NAME:-wiener-api}
    restart: unless-stopped
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      WIENER_DATABASE_URL: postgresql+psycopg://wiener:${WIENER_DB_PASSWORD:-wiener}@postgres:5432/wiener
      WIENER_REDIS_URL: redis://redis:6379/1
      WIENER_ARTIFACT_ROOT: ${PWD}/.run/wiener/artifacts
      WIENER_WORK_ROOT: ${PWD}/.run/wiener/work
      # Require a bearer token for run-management requests; unset disables authentication.
      WIENER_API_TOKEN: ${WIENER_API_TOKEN:-}
    # Share run artifacts and work paths with the worker and event receiver.
    volumes: ["${PWD}/.run/wiener:${PWD}/.run/wiener"]
    # Migrate before serving. The web service proxies requests to this internal API.
    command: sh -c "cd packages/wiener-api && alembic upgrade head && cd /app && exec uvicorn wiener_api.main:create_app --factory --host 0.0.0.0 --port 8001"

  # -----------------------------------------------------------------------------
  # 6. Telemetry (optional)
  # -----------------------------------------------------------------------------
  # Store execution traces and metrics for telemetry dashboards.
  # Wiener keeps its application run records in PostgreSQL.
  clickhouse:
    image: clickhouse/clickhouse-server:25.3-alpine
    container_name: ${CLICKHOUSE_CONTAINER_NAME:-wiener-clickhouse}
    profiles: [telemetry]
    environment:
      CLICKHOUSE_DB: otel
      CLICKHOUSE_USER: otel
      CLICKHOUSE_PASSWORD: otel
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes: ["wiener-clickhouse:/var/lib/clickhouse"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Receive OpenTelemetry traces and metrics, then forward them to ClickHouse.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.121.0
    container_name: ${OTEL_CONTAINER_NAME:-wiener-otel}
    profiles: [telemetry]
    command: ["--config=/etc/otel/collector.yaml"]
    volumes: ["./ops/otel/collector.yaml:/etc/otel/collector.yaml:ro"]
    depends_on:
      clickhouse: {condition: service_healthy}
    ports: ["127.0.0.1:${OTLP_HOST_PORT:-4317}:4317"]

  # Display execution telemetry from ClickHouse through the provisioned dashboards.
  grafana:
    image: grafana/grafana:11.6.0
    container_name: ${GRAFANA_CONTAINER_NAME:-wiener-grafana}
    profiles: [telemetry]
    environment:
      # Allow dashboard access without a login for the local telemetry setup.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    volumes:
      # Load both data-source and dashboard provisioning, plus the dashboard files.
      - ./ops/grafana:/etc/grafana/provisioning:ro
      - ./ops/boards:/etc/grafana/boards:ro
    depends_on:
      clickhouse: {condition: service_healthy}
    ports: ["127.0.0.1:${GRAFANA_HOST_PORT:-3001}:3000"]

# -----------------------------------------------------------------------------
# 7. Named volumes
# -----------------------------------------------------------------------------
# Persist service data across container replacement.
volumes:
  # Separate Mendel and Wiener databases on the shared server. Legacy volumes are retained.
  comeni-pg:
  # Telemetry stored in ClickHouse.
  wiener-clickhouse:
  # Downloaded Ollama models; OLLAMA_MODELS can select a host directory instead.
  ollama-models:
