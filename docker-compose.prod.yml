# Production differences from docker-compose.yml. Requires Docker Compose 2.24.4+.
# make prod prepares host-owned state before starting this model. Set WIENER_API_TOKEN.
# Source and example files come from the image; registry/workspace/draft data remain mounted.
services:
  postgres:
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD for production}
      MENDEL_DB_PASSWORD: ${MENDEL_DB_PASSWORD:?Set MENDEL_DB_PASSWORD for production}
      WIENER_DB_PASSWORD: ${WIENER_DB_PASSWORD:?Set WIENER_DB_PASSWORD for production}
  redis:
    ports: !reset []

  api:
    ports: !reset []
    volumes: !override
      - ./.run/registry:/app/registry
      - ./workspace:/app/workspace
      - ./.run/drafts:/app/drafts
    command: sh -c "cd packages/mendel-api && alembic upgrade head && cd /app && exec uvicorn mendel_api.main:app --host 0.0.0.0 --port 8000"
  mendel-worker:
    volumes: !override
      - ./.run/registry:/app/registry
      - ./workspace:/app/workspace
      - ./.run/drafts:/app/drafts
      - ./.run/forge:/app/forge
  ai-worker:
    volumes: !override
      - ./.run/registry:/app/registry
      - ./workspace:/app/workspace
      - ./.run/drafts:/app/drafts
      - ./.run/forge:/app/forge:ro

  ollama:
    restart: unless-stopped
    ports: !reset []
  web:
    ports: !override ["${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_HOST_PORT:-80}:80"]
  wiki:
    profiles: [wiki]
    restart: unless-stopped
    ports: !reset []

  wiener-api:
    environment:
      WIENER_API_TOKEN: ${WIENER_API_TOKEN:?Set WIENER_API_TOKEN for production execution}

  # Optional monitoring services stay internal in production, including when enabled.
  clickhouse:
    restart: unless-stopped
  otel-collector:
    restart: unless-stopped
    ports: !reset []
  grafana:
    restart: unless-stopped
    ports: !reset []
