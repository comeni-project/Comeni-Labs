<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
  <style>
    body { margin:0; background:#080B0D; color:#DFE6E6;
           font-family:"Geist", system-ui, sans-serif; }
    a { color:#6CB7FF; text-decoration:none; } a:hover { color:#fff; }
    .m  { font-family:"Geist Mono", ui-monospace, monospace; }
    .lb { font-family:"Geist Mono", ui-monospace, monospace; font-size:9.5px;
          letter-spacing:.15em; text-transform:uppercase; color:#67757A; }
    .layer { position:absolute; inset:0; pointer-events:none; }
    .breathe { animation:breathe 46s ease-in-out infinite alternate; }
    @keyframes breathe { to { opacity:1.9; } }
    .slowA { transform-box:view-box; transform-origin:700px 900px; animation:spin 720s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .bloom { transform-box:view-box; transform-origin:700px 900px;
             animation:bloom 1.4s cubic-bezier(.32,.72,0,1) backwards; }
    @keyframes bloom { from { transform:scale(.55); opacity:0; } }
    .scan { background-image:repeating-linear-gradient(180deg, rgba(255,255,255,.010) 0 1px, transparent 1px 3px); }
    .vig  { background:radial-gradient(120% 88% at 50% 12%, transparent 40%, rgba(8,11,13,.92) 100%); }
    .settle { animation:settle 320ms cubic-bezier(.32,.72,0,1) backwards; }
    @keyframes settle { from { opacity:0; transform:translateY(6px); } }
    .cur { animation:blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity:0; } }
    @media (prefers-reduced-motion: reduce) {
      .breathe,.slowA,.bloom,.settle,.cur { animation:none !important; }
    }
  </style>
</helmet>

<div style="position:relative; min-height:760px; overflow:hidden; background:#080B0D;">
  <svg class="layer" viewBox="0 0 1400 760" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <g class="bloom"><g class="breathe" fill="none">
      <g class="slowA" stroke="#6CB7FF" stroke-width="1">
        <circle cx="700" cy="900" r="470"  opacity=".10"/>
        <circle cx="700" cy="900" r="660"  opacity=".07"/>
        <circle cx="700" cy="900" r="880"  opacity=".048"/>
        <circle cx="700" cy="900" r="1140" opacity=".032"/>
        <path d="M700 900 L-140 120" stroke-width=".75" opacity=".05"/>
        <path d="M700 900 L1540 120" stroke-width=".75" opacity=".05"/>
      </g>
      <g stroke="#10AA91"><circle cx="700" cy="900" r="780" opacity=".035" stroke-width="1"/></g>
    </g></g>
  </svg>
  <div class="layer scan"></div>
  <div class="layer vig"></div>

  <div style="position:relative; padding:28px 44px; display:flex; flex-direction:column; min-height:704px;">

    <div style="display:flex; align-items:center; justify-content:space-between;
                padding-bottom:20px; border-bottom:1px solid #172025;">
      <div style="display:flex; align-items:baseline; gap:28px;">
        <span style="font-size:14px; font-weight:700; letter-spacing:-.02em;">Comeni</span>
        <span style="font-size:12.5px; color:#67757A;">Builder</span>
        <span style="font-size:12.5px; color:#67757A;">Runs</span>
        <span style="font-size:12.5px; color:#67757A;">Registry</span>
      </div>
      <span class="m" style="font-size:11px; color:#67757A;">Ferreira lab</span>
    </div>

    <div style="flex-grow:1; display:flex; flex-direction:column; justify-content:center;
                align-items:center; gap:30px; padding-bottom:80px;">

      <div class="settle" style="font-size:34px; font-weight:600; letter-spacing:-.03em;
                  line-height:1.25; text-align:center; max-width:22ch; text-wrap:balance;">
        What do you want to make?
      </div>

      <div class="settle" style="animation-delay:120ms; width:min(660px, 100%);
                  border:1px solid #1E3A4E; background:#0B1013; padding:15px 18px;
                  display:flex; align-items:center; gap:12px;">
        <span class="m" style="font-size:14px; color:#6CB7FF;">&rsaquo;</span>
        <span style="font-size:15px; color:#455257;">gene counts from paired-end RNA-seq of mouse liver</span>
        <span class="cur" class="m" style="font-size:15px; color:#6CB7FF;">&#9646;</span>
      </div>

      <div class="settle" style="animation-delay:220ms; font-size:12.5px; color:#67757A;">
        or <a href="#">build it by hand</a>, or start from a <a href="#">published pipeline</a>
      </div>

    </div>

  </div>
</div>
</x-dc>
</body>
</html>
