  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin:0; background:#080B0D; color:#DFE6E6;
           font-family:"Geist", system-ui, sans-serif; font-variant-numeric:tabular-nums; }
    a { color:#6CB7FF; text-decoration:none; } a:hover { color:#fff; }
    .m  { font-family:"Geist Mono", ui-monospace, monospace; }
    .lb { font-family:"Geist Mono", ui-monospace, monospace; font-size:9.5px;
          letter-spacing:.15em; text-transform:uppercase; color:#67757A; }
    .layer { position:absolute; inset:0; pointer-events:none; }
    .breathe { animation:breathe 46s ease-in-out infinite alternate; }
    @keyframes breathe { to { opacity:1.85; } }
    .slowA { transform-box:view-box; transform-origin:120px 880px; animation:spin 680s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .scan { background-image:repeating-linear-gradient(180deg, rgba(255,255,255,.010) 0 1px, transparent 1px 3px); }
    .vig  { background:radial-gradient(130% 92% at 50% 3%, transparent 46%, rgba(8,11,13,.88) 100%); }
    .settle { animation:settle 200ms cubic-bezier(.32,.72,0,1) backwards; }
    @keyframes settle { from { opacity:0; transform:translateY(4px); } }
    .pop { animation:pop 180ms cubic-bezier(.32,.72,0,1) backwards; }
    @keyframes pop { from { opacity:0; transform:translateY(-6px) scale(.985); } }
    .grow { animation:grow 520ms cubic-bezier(.32,.72,0,1) backwards; transform-origin:left; }
    @keyframes grow { from { transform:scaleX(0); } }
    .cur { animation:blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity:0; } }
    .lift { transition:background-color 140ms ease, border-color 140ms ease,
                       transform 140ms cubic-bezier(.32,.72,0,1); }
    .lift:hover { background-color:#0E1418; transform:translateY(-1px); }
    .dash { stroke-dasharray:4 5; animation:march 900ms linear infinite; }
    @keyframes march { to { stroke-dashoffset:-18; } }
    @media (prefers-reduced-motion: reduce) {
      .breathe,.slowA,.settle,.pop,.grow,.cur,.dash { animation:none !important; }
      .lift { transition:none; }
    }
    /* ── node: a uniform schematic symbol, not a floating card ───────────── */
    .node { position:absolute; width:172px; height:112px; background:#0C1216;
            border:1px solid #253239; border-left:3px solid #2C3E45;
            display:flex; flex-direction:column; }
    .node .hd { display:flex; align-items:center; gap:8px; height:28px;
                padding:0 10px; border-bottom:1px solid #1A252A; }
    .node .rows { flex:1; padding:5px 0; }
    .node .pr { display:flex; align-items:center; gap:7px; height:19px; padding:0 10px;
                font-family:"Geist Mono", ui-monospace, monospace; font-size:8.5px; }
    .node .ft { height:24px; display:flex; align-items:center; padding:0 10px;
                border-top:1px solid #1A252A; font-family:"Geist Mono", ui-monospace, monospace;
                font-size:9px; color:#5D6C71; }
    .node.sel { border-color:#6CB7FF; border-left-color:#6CB7FF;
                box-shadow:0 0 0 1px rgba(108,183,255,.26); }
    .node.meas { border-left-color:#C1B508; }
    .node.open { border-left-color:#E3674E; }
    /* a SOURCE is not a process — it carries a type, never a path */
    .src { position:absolute; width:120px; height:80px; background:#0A1418;
           border:1px dashed #2E4750; border-left:3px solid #6CB7FF;
           display:flex; flex-direction:column; justify-content:center; padding:0 10px; }
    .port { position:absolute; width:7px; height:7px; background:#0C1216;
            border:1px solid #4A5C64; }
    .port.on { border-color:#6CB7FF; background:#12222E; }
    .plus { position:absolute; width:18px; height:18px;
            border:1px solid #1E3A4E; color:#6CB7FF; background:#0A1218;
            display:flex; align-items:center; justify-content:center;
            font-size:13px; line-height:1; cursor:pointer; }
    /* topological levels, drawn faintly. structure without a dot grid. */
    .col { position:absolute; top:0; bottom:0; width:1px; background:#121B1F; }
    .shell { display:flex; align-items:center; justify-content:space-between;
             padding-bottom:14px; border-bottom:1px solid #172025; }
  </style>
