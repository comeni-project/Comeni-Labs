# Workspace metadata, local package resolution, development tools, and pytest settings.
# Sections: project; repository links; workspace members and sources; tools; test policy.
# The root has no build backend: uv installs its dependencies, not a comeni-labs package.
# Individual packages declare their own versions and build backends in packages/.

[project]
name = "comeni-labs"
version = "0.1.0"
requires-python = ">=3.12"
description = "Deterministic bioinformatics pipeline construction — same goal in, same pipeline out, and nothing guessed silently"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{name = "Rafael Correia"}]
keywords = ["bioinformatics", "nextflow", "workflow", "reproducibility", "pipeline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]

# Install the full application workspace when syncing from the repository root.
dependencies = ["comeni-core", "mendel-resolver", "mendel-compiler", "mendel-forge", "comeni-ai", "mendel-ai", "mendel-api", "wiener-core", "wiener-api", "dag-core", "comeni-vendor", "comeni-inspect", "mendel-authoring"]

[project.urls]
Homepage = "https://github.com/comeni-project/Comeni-Labs"
Documentation = "https://github.com/comeni-project/Comeni-Labs/tree/main/docs"
Repository = "https://github.com/comeni-project/Comeni-Labs"
Issues = "https://github.com/comeni-project/Comeni-Labs/issues"
Changelog = "https://github.com/comeni-project/Comeni-Labs/blob/main/CHANGELOG.md"

# Discover package projects; all members share the root uv.lock.
[tool.uv.workspace]
members = ["packages/*"]

# Resolve these names to local members instead of fetching them from a package index.
# Root source mappings are inherited unless a member overrides them.
[tool.uv.sources]
comeni-core = { workspace = true }
mendel-resolver = { workspace = true }
mendel-compiler = { workspace = true }
mendel-forge = { workspace = true }
comeni-ai = { workspace = true }
mendel-ai = { workspace = true }
mendel-api = { workspace = true }
wiener-core = { workspace = true }
wiener-api = { workspace = true }
dag-core = { workspace = true }
comeni-vendor = { workspace = true }
comeni-inspect = { workspace = true }
mendel-authoring = { workspace = true }

# dev is installed by default; include docs with uv sync --group docs.
[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "pytest-cov>=5.0", "fastapi>=0.115", "httpx>=0.27", "fakeredis>=2.23", "pytest-asyncio>=0.24"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5"]

# Collect repository, package, and registry-inspector tests from the root.
[tool.pytest.ini_options]
# Make shared test helpers importable as support.*.
pythonpath = ["tests"]
testpaths = ["tests", "packages", "registry/inspectors"]
markers = [
    "slow: needs Docker and Nextflow; run nightly, not on a pull request",
    "real_settings: read settings from the real Postgres store, not the suite's empty one",
]
# Load isolated database configuration before test imports, including package-only runs.
# Keep execution tests out of the default suite; make slow selects them with -m slow.
addopts = "-p support.pytest_bootstrap -m 'not slow'"

# pytest-asyncio handles explicitly marked async tests and its own decorated fixtures.
# Sync tests that call asyncio.run() are unaffected by this mode.
asyncio_mode = "strict"
