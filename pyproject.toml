[project]
name = "comeni-labs"
version = "0.1.0"
requires-python = ">=3.12"
description = "Deterministic bioinformatics pipeline construction — same goal in, same pipeline out, and nothing guessed silently"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{name = "Rafael Correia"}]
keywords = ["bioinformatics", "nextflow", "workflow", "reproducibility", "pipeline"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]

dependencies = ["comeni-core", "mendel-resolver", "mendel-compiler", "mendel-forge", "comeni-ai", "mendel-ai", "mendel-api", "wiener-core", "wiener-api", "dag-core", "comeni-vendor"]

[project.urls]
Homepage = "https://github.com/comeni-project/Comeni-Labs"
Documentation = "https://github.com/comeni-project/Comeni-Labs/tree/main/docs"
Repository = "https://github.com/comeni-project/Comeni-Labs"
Issues = "https://github.com/comeni-project/Comeni-Labs/issues"
Changelog = "https://github.com/comeni-project/Comeni-Labs/blob/main/CHANGELOG.md"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
comeni-core = { workspace = true }
mendel-resolver = { workspace = true }
mendel-compiler = { workspace = true }
mendel-forge = { workspace = true }
comeni-ai = { workspace = true }
mendel-ai = { workspace = true }
mendel-api = { workspace = true }
wiener-core = { workspace = true }
wiener-api = { workspace = true }
dag-core = { workspace = true }
comeni-vendor = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "pytest-cov>=5.0", "fastapi>=0.115", "httpx>=0.27", "fakeredis>=2.23", "pytest-asyncio>=0.24"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5"]

[tool.pytest.ini_options]
testpaths = ["tests", "packages"]
markers = ["slow: needs Docker and Nextflow; run nightly, not on a pull request"]
addopts = "-m 'not slow'"

# **Strict, not auto**, and that is the whole reason this is written down. In `auto` mode every
# `async def test_` is collected and run; in `strict` an unmarked one fails with "async def
# functions are not natively supported" — loudly, naming the test. A test framework that
# silently changes how a test is collected is the shape of guard failure this repository keeps
# finding: green faster, in the direction nobody investigates.
#
# The pre-existing async tests do not go through this at all. `wiener-api` calls `asyncio.run()`
# inside sync test functions, which is untouched by either mode; the plugin arrived with the
# forge's source adapters, where `sync()`, `bundle()` and every HTTP call are async because ARQ
# and FastAPI are.
asyncio_mode = "strict"
